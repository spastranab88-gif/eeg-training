    const fns=[(dx,dy)=>T.disk.sample(dx,dy)/T.vmax,(dx,dy)=>cur.R.sample(dx,dy)/T.vmax,(dx,dy)=>(cur.R.sample(dx,dy)-T.disk.sample(dx,dy))/T.vmax];
    cvs.forEach((st,k)=>{ const geo=topoGeo(st,28,10); paintTopo(st,heats[k],geo,fns[k]); cTitle(st.ctx,titles[k],10,17);
      if(k===1) e.pts.forEach(p=>{ const [dx,dy]=sphToFlat(p); if(dx*dx+dy*dy>1) return; st.ctx.fillStyle=C.ink; st.ctx.beginPath(); st.ctx.arc(geo.cx+dx*geo.Rt,geo.cy+dy*geo.Rt,S.n>128?1.4:2,0,7); st.ctx.fill(); });
      if(k===0) T.srcs.forEach(s=>{ const [x,y]=flatPx(geo,s.u); xMark(st.ctx,x,y,4,C.ink); }); });
    $('#d3sp',root).textContent='≈'+e.spacing.toFixed(1)+' cm';
    $('#d3er',root).textContent=(cur.err*100).toFixed(1)+'%';
    const i=DENS_COUNTS.indexOf(S.n); $('#d3g',root).textContent=i>0?`${((err(S.cfg,S.skull,DENS_COUNTS[i-1])-cur.err)*100).toFixed(1)} points (from ${DENS_COUNTS[i-1]})`:'n/a';
    drawChart();

  function drawChart(){

    const L=52,R=w-20,T=34,B=h-34; cTitle(ctx,'Reconstruction error by number of electrodes (top of the head, to 85° from the vertex)',L-40,18);
    const series=[['skull','With skull',C.accent],['none','Without skull',C.muted]];

    const xs=i=>L+i/(DENS_COUNTS.length-1)*(R-L), ys=v=>B-v/ymax*(B-T);
    ctx.strokeStyle=C.line; ctx.lineWidth=1; for(let v=0;v<=ymax;v+=ymax/4){ ctx.beginPath(); ctx.moveTo(L,ys(v)); ctx.lineTo(R,ys(v)); ctx.stroke(); cText(ctx,Math.round(v)+'%',L-6,ys(v)+4,C.muted,'right'); }
    DENS_COUNTS.forEach((n,i)=>cText(ctx,n+'',xs(i),B+14,n===S.n?C.ink:C.muted,'center',n===S.n?11.5:10.5));
    cText(ctx,'electrodes',R,h-4,C.muted,'right');
    series.forEach(([k,lab,color],si)=>{ const d=data[si]; const on=k===S.skull; ctx.strokeStyle=color; ctx.lineWidth=on?2.6:1.5; ctx.setLineDash(on?[]:[5,4]); ctx.beginPath(); d.forEach((v,i)=>i?ctx.lineTo(xs(i),ys(v)):ctx.moveTo(xs(i),ys(v))); ctx.stroke(); ctx.setLineDash([]);
      d.forEach((v,i)=>{ ctx.fillStyle=color; ctx.beginPath(); ctx.arc(xs(i),ys(v),on&&DENS_COUNTS[i]===S.n?5.5:3,0,7); ctx.fill(); });
      cText(ctx,lab,xs(4)-8,ys(d[4])-9,color,'right',11); });
  }
  $('#d3n',root).addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; $$('#d3n .chip',root).forEach(c=>c.setAttribute('aria-pressed',c===b)); S.n=+b.dataset.n; update(); });
  bindSeg(root,'d3skull',v=>{ S.skull=v; update(); });
  bindSeg(root,'d3cfg',v=>{ S.cfg=v; update(); });
  cvs.forEach(c=>c.onresize=()=>cur&&update()); ch.onresize=()=>cur&&drawChart();
  themeListeners.add(update); update();
  return ()=>{ cvs.forEach(c=>c.destroy()); ch.destroy(); themeListeners.delete(update); };
}

function labReference(root){
  root.innerHTML=`
  <div class="lab">
    <div class="lab-bar">${seg('r4ref',[['inf','Infinity (simulation only)'],['cz','Vertex (Cz)'],['mast','Linked mastoids'],['avg','Average'],['csd','Surface Laplacian']],'cz')}</div>
    <div class="split">
      <div class="stage"><canvas id="r4w" aria-label="ERP waveforms at selected channels"></canvas></div>
      <div class="stage"><canvas id="r4m" aria-label="Scalp map at the selected time"></canvas></div>
    </div>

      <div class="ctl"><label for="r4t">Time after the sound <output id="r4to"></output></label><input type="range" id="r4t" min="0" max="700" step="4" value="100"></div>
      <div class="ctl"><span class="lbl">Playback</span><span><button class="btn" id="r4play" type="button">Play</button> <button class="btn ghost" id="r4n1" type="button">N1</button><button class="btn ghost" id="r4p3" type="button">P3</button></span></div>
      <div class="ctl" id="r4covw"><span class="lbl">Average taken over</span>${seg('r4cov',[['sphere','Whole head'],['net','Net to face and neck'],['cap','Cap above the ears']],'net')}</div>
    </div>

      <div class="readout"><span class="eyebrow">Pz minus Fz at this time</span><span class="v" id="r4diff">0</span></div>
      <div class="readout"><span class="eyebrow">Signal subtracted from every channel</span><span class="v" id="r4sub">0</span></div>
      <div class="readout"><span class="eyebrow">Cz at this time</span><span class="v" id="r4cz">0</span></div>
      <div class="legend"><span>−</span><span class="bar" style="background:${legendCSS()}"></span><span>+</span></div>
    </div>
  </div>`;
  const CH=[...E1010,...MASTOIDS], NC=CH.length, idx=Object.fromEntries(CH.map((c,i)=>[c.n,i]));
  const SHOW=['Fz','Cz','Pz','Oz','T7','T8','M1'];
  const g=(t,mu,sd)=>Math.exp(-0.5*((t-mu)/sd)**2);
  const SRC=[ {d:mkDip(72,-88,4.5,'tangential',0,1), tc:t=>2.2*(g(t,100,22)-0.6*g(t,190,35))},
              {d:mkDip(72,88,4.5,'tangential',0,1),  tc:t=>2.2*(g(t,100,22)-0.6*g(t,190,35))},
              {d:mkDip(32,180,3.6,'radial',0,1),     tc:t=>1.3*g(t,340,70)},
              {d:mkDip(80,180,1.8,'radial',0,1),     tc:t=>0.45*g(t,95,16)} ];
  const TT=[]; for(let t=0;t<=700;t+=4) TT.push(t); const NT=TT.length;
  const LF=CH.map(c=>SRC.map(s=>dipV(c.p,s.d)));
  const TC=TT.map(t=>SRC.map(s=>s.tc(t)));
  let V=TT.map((_,k)=>CH.map((c,i)=>SRC.reduce((a,s,j)=>a+LF[i][j]*TC[k][j],0)));
  let pk=0; V.forEach(r=>pk=Math.max(pk,r[idx.Pz])); const SC=10/pk; V=V.map(r=>r.map(x=>x*SC));
  const covPts={ sphere:fibCap(600,180), net:fibCap(256,122), cap:fibCap(160,90) };
  const covMean={}; for(const k in covPts){ const pts=covPts[k]; const lm=SRC.map(s=>pts.reduce((a,p)=>a+dipV(p,s.d),0)/pts.length); covMean[k]=TC.map(tc=>tc.reduce((a,x,j)=>a+x*lm[j],0)*SC); }
  const sp=makeSpline(CH.map(c=>c.p),1e-5), opG=mapOperator(sp,60,'g'), opH=mapOperator(sp,60,'h');
  const COEF=V.map(r=>sp.coef(r));
  const Hee=CH.map(c=>sp.row(c.p,'h'));
  let CSD=COEF.map(c=>Hee.map(w=>{ let s=0; for(let i=0;i<NC;i++) s+=c[i]*w[i]; return s; }));
  let cm=0; CSD.forEach(r=>SHOW.forEach(n=>cm=Math.max(cm,Math.abs(r[idx[n]])))); let vm=0; V.forEach(r=>SHOW.forEach(n=>vm=Math.max(vm,Math.abs(r[idx[n]])))); const CSC=vm/cm; CSD=CSD.map(r=>r.map(x=>x*CSC));
  const S={ref:'cz', cov:'net', k:25, play:false};
  function sub(k){ const r=V[k]; switch(S.ref){ case 'cz': return r[idx.Cz]; case 'mast': return (r[idx.M1]+r[idx.M2])/2; case 'avg': return covMean[S.cov][k]; default: return 0; } }
  function val(k,i){ return S.ref==='csd'? CSD[k][i] : V[k][i]-sub(k); }
  const wv=setupCanvas($('#r4w',root),w=>Math.max(330,Math.min(420,w*0.75)));
  const mp=setupCanvas($('#r4m',root),w=>Math.max(260,Math.min(380,w*0.95)));
  const heat=makeHeat(); let vmaxW=1, vmaxM=1;
  function scales(){ vmaxW=0; vmaxM=0; for(let k=0;k<NT;k++){ for(const n of SHOW) vmaxW=Math.max(vmaxW,Math.abs(val(k,idx[n]))); for(let i=0;i<NC-2;i++) vmaxM=Math.max(vmaxM,Math.abs(val(k,i))); } }
  function draw(){

    const d=val(k,idx.Pz)-val(k,idx.Fz); $('#r4diff',root).textContent=(d>=0?'+':'')+d.toFixed(2)+unit+(S.ref==='csd'?'':' (same for every reference)');
    $('#r4sub',root).textContent=S.ref==='csd'?'none, spatial filter':S.ref==='inf'?'none':((sub(k)>=0?'+':'')+sub(k).toFixed(2)+' µV');
    $('#r4cz',root).textContent=(val(k,idx.Cz)>=0?'+':'')+val(k,idx.Cz).toFixed(2)+unit;
    $('#r4covw',root).style.visibility=S.ref==='avg'?'visible':'hidden';
    drawWaves(); drawMap();
  }
  function drawWaves(){
    const ctx=wv.ctx,{w,h}=wv; ctx.fillStyle=C.surface; ctx.fillRect(0,0,w,h);

    cTitle(ctx,S.ref==='csd'?'Current source density at 7 channels':'Simulated auditory ERP at 7 channels',12,17);
    cText(ctx,'positive up',w-12,17,C.muted,'right');
    ctx.strokeStyle=C.line; ctx.lineWidth=1; [0,100,200,300,400,500,600,700].forEach(t=>{ ctx.beginPath(); ctx.moveTo(xs(t),T); ctx.lineTo(xs(t),B); ctx.stroke(); cText(ctx,t+'',xs(t),B+13,C.muted,'center'); });
    cText(ctx,'ms',R+16,B+13,C.muted,'left');
    const amp=rh*0.48/vmaxW;
    SHOW.forEach((n,r)=>{ const y0=T+rh*(r+.5), i=idx[n];
      ctx.strokeStyle=rgb(C.inkRGB,0.18); ctx.beginPath(); ctx.moveTo(L,y0); ctx.lineTo(R,y0); ctx.stroke();
      const isRef=(S.ref==='cz'&&n==='Cz')||(S.ref==='mast'&&n==='M1');
      cText(ctx,n,L-8,y0+4,isRef?C.accent:C.ink,'right',11);
      ctx.strokeStyle=isRef?C.accent:C.ink; ctx.lineWidth=1.6; ctx.beginPath();
      for(let k=0;k<NT;k++){ const x=xs(TT[k]), y=y0-clamp(val(k,i)*amp,-rh*0.62,rh*0.62); k?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.stroke(); });
    const sb=vmaxW>8?5:vmaxW>3?2:1; const sx=w-34, sy=T+rh*0.6; ctx.strokeStyle=C.muted; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(sx,sy-sb*amp/2); ctx.lineTo(sx,sy+sb*amp/2); ctx.stroke();
    if(S.ref!=='csd') cText(ctx,sb+' µV',sx,sy+sb*amp/2+13,C.muted,'center');
    ctx.strokeStyle=C.accent; ctx.lineWidth=1.5; ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(xs(TT[S.k]),T-4); ctx.lineTo(xs(TT[S.k]),B); ctx.stroke(); ctx.setLineDash([]);
  }
  function drawMap(){
    const k=S.k; const geo=topoGeo(mp);
    const G=S.ref==='csd'? applyMap(opH,COEF[k],0) : applyMap(opG,COEF[k],sub(k));
    const sc=S.ref==='csd'? vmaxM : vmaxM;
    if(S.ref==='csd'){ for(let i=0;i<G.d.length;i++) G.d[i]*=CSC; }
    paintTopo(mp,heat,geo,(dx,dy)=>G.sample(dx,dy)/sc);
    cTitle(mp.ctx,`Scalp map at ${TT[k]} ms`,12,18);
    CH.forEach(c=>{ const [dx,dy]=sphToFlat(c.p); if(dx*dx+dy*dy>1) return; const x=geo.cx+dx*geo.Rt, y=geo.cy+dy*geo.Rt; mp.ctx.fillStyle=rgb(C.inkRGB,0.55); mp.ctx.beginPath(); mp.ctx.arc(x,y,1.6,0,7); mp.ctx.fill(); });
    const ring=n=>{ const c=CH[idx[n]]; const [dx,dy]=sphToFlat(c.p); const r=Math.hypot(dx,dy); const f=r>1?0.995/r:1; const x=geo.cx+dx*f*geo.Rt, y=geo.cy+dy*f*geo.Rt; mp.ctx.strokeStyle=C.accent; mp.ctx.lineWidth=2.5; mp.ctx.beginPath(); mp.ctx.arc(x,y,7,0,7); mp.ctx.stroke(); };

    cText(mp.ctx,S.ref==='cz'?'ring = reference electrode':S.ref==='mast'?'rings = mastoids (below the map edge)':S.ref==='csd'?'reference free':'',12,mp.h-8,C.muted);

  }

  bindSeg(root,'r4ref',setRef); bindSeg(root,'r4cov',v=>{ S.cov=v; scales(); draw(); });
  $('#r4t',root).oninput=e=>{ S.k=Math.round(+e.target.value/4); draw(); };

}

/* =========================================================================
   M2 LAB 5: MONTAGE AND LAYOUT
   ========================================================================= */
function icosphere(f){ const v=[[0,0,1],[0,0,-1]]; const zr=1/Math.sqrt(5), rr=2/Math.sqrt(5);
  for(let k=0;k<5;k++){ const a=k*72*D2R; v.push([rr*Math.sin(a),rr*Math.cos(a),zr]); } for(let k=0;k<5;k++){ const a=(k*72+36)*D2R; v.push([rr*Math.sin(a),rr*Math.cos(a),-zr]); }
  const U=k=>2+(k%5), Lw=k=>7+(k%5), F=[]; for(let k=0;k<5;k++){ F.push([0,U(k),U(k+1)],[1,Lw(k+1),Lw(k)],[U(k),Lw(k),U(k+1)],[U(k+1),Lw(k),Lw(k+1)]); }
  const seen=new Map();
  for(const [a,b,c] of F){ const A=v[a],B=v[b],Cc=v[c]; for(let i=0;i<=f;i++) for(let j=0;j<=f-i;j++){ const p=norm3([0,1,2].map(d=>A[d]+(B[d]-A[d])*i/f+(Cc[d]-A[d])*j/f)); const key=p.map(x=>Math.round(x*1e4)).join(','); if(!seen.has(key)) seen.set(key,p); } }
  return [...seen.values()]; }
function geodesic(N,f){ const pts=icosphere(f).sort((a,b)=>b[2]-a[2]||Math.atan2(a[0],a[1])-Math.atan2(b[0],b[1])).slice(0,N); return pts.map((p,i)=>({n:i===0?'VREF':'E'+i,p,...angles(p)})); }
function labLayout(root){

  const S={view:'sag', ten:false, sys:'g128'};
  const SYS={ '1020':{pts:E1020_SET, ref:'set by the amplifier (often Cz, FCz or a mastoid)'}, '1010':{pts:E1010, ref:'set by the amplifier (often Cz, FCz or a mastoid)'},
              g128:{pts:null,f:4,N:128, ref:'vertex electrode (VREF)'}, g256:{pts:null,f:6,N:256, ref:'vertex electrode (VREF)'} };
  function sysPts(k){ const s=SYS[k]; if(!s.pts) s.pts=geodesic(s.N,s.f); if(s.sp==null) s.sp=nnMedianCm(s.pts.map(e=>e.p)); return s; }
  function drawMeasure(){

    ctx.strokeStyle=C.accent; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,base,Ra,Math.PI,0); ctx.stroke();
    const ends=S.view==='sag'?['Nasion','Inion']:['Left preauricular','Right preauricular'];
    [[0,ends[0]],[100,ends[1]]].forEach(([p,n])=>{ const [x,y]=pt(p); ctx.fillStyle=C.ink; ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill(); cText(ctx,n,x,y+18,C.ink,'center',11); });
    const main=S.view==='sag'?[[10,'Fpz'],[30,'Fz'],[50,'Cz'],[70,'Pz'],[90,'Oz']]:[[10,'T7'],[30,'C3'],[50,'Cz'],[70,'C4'],[90,'T8']];
    const ten=S.view==='sag'?[[20,'AFz'],[40,'FCz'],[60,'CPz'],[80,'POz']]:[[20,'C5'],[40,'C1'],[60,'C2'],[80,'C6']];
    const seglab=[[5,'10%'],[20,'20%'],[40,'20%'],[60,'20%'],[80,'20%'],[95,'10%']];
    seglab.forEach(([p,l])=>{ const a=Math.PI*(1-p/100); cText(ctx,l,cx+(Ra-16)*Math.cos(a),base-(Ra-16)*Math.sin(a)+4,C.muted,'center',10); });
    const dot=(p,n,big)=>{ const [x,y]=pt(p); const a=Math.PI*(1-p/100); ctx.fillStyle=big?C.accent:C.surface; ctx.strokeStyle=C.accent; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,big?7:5,0,7); ctx.fill(); ctx.stroke(); cText(ctx,n,x+Math.cos(a)*20,y-Math.sin(a)*20+4,big?C.ink:C.muted,'center',big?12:10.5); };
    if(S.ten) ten.forEach(([p,n])=>dot(p,n,false)); main.forEach(([p,n])=>dot(p,n,true));
    cTitle(ctx,S.view==='sag'?'Midline, measured from nasion to inion':'Coronal line through Cz, measured between the preauricular points',12,18);
    cText(ctx,'The 10-20 name means 10% and 20% steps along these arcs, not fixed distances',12,h-8,C.muted);
  }
  let proj=[];
  function drawLayout(){
    const ctx=ls.ctx,{w,h}=ls; ctx.fillStyle=C.surface; ctx.fillRect(0,0,w,h);
    const s=sysPts(S.sys); const SC=130; const Rt=Math.min(w/2-30,h/2-30); const geo={cx:w/2,cy:h/2+6,Rt};
    const ear=geo.Rt*90/SC;
    ctx.fillStyle=rgb(C.accentRGB,0.07); ctx.beginPath(); ctx.arc(geo.cx,geo.cy,ear,0,7); ctx.fill();
    headOutline(ctx,{cx:geo.cx,cy:geo.cy,Rt:ear});
    ctx.strokeStyle=rgb(C.inkRGB,0.25); ctx.setLineDash([3,4]); ctx.beginPath(); ctx.arc(geo.cx,geo.cy,geo.Rt*72/SC,0,7); ctx.stroke(); ctx.setLineDash([]);
    cText(ctx,'solid outline = ear level',w-12,40,C.muted,'right'); cText(ctx,'dashed ring = 10-20 outer ring (Fpz, T7, Oz)',w-12,54,C.muted,'right');
    proj=s.pts.map(e=>{ const [dx,dy]=sphToFlat(e.p,SC); return {e,x:geo.cx+dx*geo.Rt,y:geo.cy+dy*geo.Rt}; });
    const big=s.pts.length<=61;
    proj.forEach(({e,x,y})=>{ const ref=e.n==='VREF'; const low=e.colat>90; ctx.fillStyle=ref?C.accent:low?C.surface:C.ink; ctx.strokeStyle=ref?C.accent:C.ink; ctx.lineWidth=1.3; ctx.beginPath(); ctx.arc(x,y,ref?6:big?4.2:2.8,0,7); ctx.fill(); ctx.stroke();
      if(big && S.sys==='1020') cText(ctx,e.n,x,y-8,C.ink,'center',10.5); });
    if(S.sys==='1010') proj.forEach(({e,x,y})=>cText(ctx,e.n,x,y-7,C.muted,'center',8.5));
    cTitle(ctx,'Seen from above, nose up',12,18);
    cText(ctx,S.sys[0]==='g'?'Illustrative geodesic layout. Use your net’s sensor file for real positions.':'Idealized positions on a spherical head',12,h-8,C.muted);
    const low=s.pts.filter(e=>e.colat>90).length;
    $('#l5n',root).textContent=s.pts.length; $('#l5sp',root).textContent='≈'+s.sp.toFixed(1)+' cm';
    $('#l5low',root).textContent=low?`${low} electrodes (open circles)`:'none';
    $('#l5ref',root).textContent=s.ref;
  }
  const cv=$('#l5l',root);
  cv.addEventListener('pointermove',e=>{ const p=ptr(e,cv); let b=null,bd=144; proj.forEach(o=>{ const d=(o.x-p.x)**2+(o.y-p.y)**2; if(d<bd){bd=d;b=o;} });
    if(!b){ tip.hidden=true; return; } let txt=b.e.n;
    if(S.sys[0]==='g'){ let nb=null,na=9; E1010.forEach(t=>{ const a=Math.acos(clamp(dot3(t.p,b.e.p),-1,1)); if(a<na){na=a;nb=t;} }); txt+=b.e.n==='VREF'?'  vertex reference':`  nearest 10-10: ${nb.n} (${(na*R_CM).toFixed(1)} cm)`; }
    tip.hidden=false; tip.style.left=b.x+'px'; tip.style.top=b.y+'px'; tip.textContent=txt; });
  cv.addEventListener('pointerleave',()=>tip.hidden=true);
  bindSeg(root,'l5view',v=>{ S.view=v; drawMeasure(); });
  $('#l5ten',root).onchange=e=>{ S.ten=e.target.checked; drawMeasure(); };
  bindSeg(root,'l5sys',v=>{ S.sys=v; tip.hidden=true; drawLayout(); });
  ms.onresize=drawMeasure; ls.onresize=drawLayout; const redraw=()=>{ drawMeasure(); drawLayout(); }; themeListeners.add(redraw);
  redraw();
  return ()=>{ ms.destroy(); ls.destroy(); themeListeners.delete(redraw); };
}

const QUIZ2=[

  {q:"Why are neighboring channels highly correlated even when their sources differ?", o:["Electrodes share the same amplifier","Volume conduction spreads each source over a wide area of scalp, so each channel mixes several sources","The skull amplifies signals that are close together","Neighboring electrodes always sit over the same gyrus"], a:1,

PAGES.conduction=labPage(SEC('conduction'),
  `<p class="lead">Current from a cortical source does not stay put. It spreads through brain, cerebrospinal fluid, skull and scalp. The skull conducts poorly, so the field spreads sideways inside it before reaching the electrodes. Estimates of how much more the skull resists current than brain range widely, from about 15 to 80 times.</p>`,
  labConduction,
  ["Start with two sources 4 cm apart and the skull at 25×. Compare the two maps: two clear peaks on the cortex, a single blob at the scalp.","Read the correlation between the electrodes over A and B. On the cortex the two signals are nearly independent; at the scalp they share most of their signal, and the 6 Hz rhythm shows up over A.","Drag the skull slider down to 1×, then up to 80×. Separate the sources until the scalp shows two peaks again and note the distance."],
  "Volume conduction spreads each source over a wide area of scalp, and the skull widens and weakens that spread. Neighboring channels end up highly correlated even when their sources differ, and a single source can appear at many sites. No scalp waveform can be read as the activity directly under its electrode.");
PAGES.inverse=labPage(SEC('inverse'),
  `<p class="lead">The forward problem is unique: given the sources and a head model, there is one scalp map. The inverse problem is not. Many source configurations produce the same map, so any answer depends on the assumptions you add. Here the assumption is a single dipole. Fit it to each recorded map, then reveal what actually produced it.</p>`,
  labInverse,
  ["Map 2 is loaded. Click Find the best single dipole. Note the fit and where the dipole lands in the front and top views, then reveal the true sources.","Try Map 3. The fit is good again. Compare the model depth with the depth of the real activity.","Try Map 4 and fit it. A poor fit tells you the model is wrong; a good fit alone does not tell you the model is right."],
  "A good fit is not proof of a correct source. A deep midline dipole explains two bilateral auditory sources, and a deeper dipole explains a broad superficial patch. Source estimates are only as good as the constraints behind them: distributed models, priors, and head models built from each person's MRI.");
PAGES.density=labPage(SEC('density'),
  `<p class="lead">More electrodes sample the scalp field more finely. But the skull has already smoothed that field before any electrode sees it. Once electrodes sit closer together than the smallest detail the skull lets through, extra channels add little. Here the same activity is sampled with 21 to 256 electrodes and the map is rebuilt with spherical splines.</p>`,
  labDensity,
  ["Step through 21, 32, 64, 128 and 256 with the skull on. Watch the error and the gain from each doubling.","Switch to Without skull. The field is sharper, and the error keeps falling as channels are added. This is the detail the skull removes.","Choose Two sources 2.5 cm apart. Check whether any channel count separates them at the scalp."],
  "High density gives finer spatial sampling, better topographic detail, and more reliable source estimates when paired with an individual head model. It does not undo skull blurring, so there is a point beyond which extra channels add little. Sampling more points of an already blurred field still gives a blurred field.");
PAGES.reference=labPage(SEC('reference'),
  `<p class="lead">A potential only exists between two points, so every channel is a difference: this site minus the reference. The reference is on the head and picks up brain activity too. Whatever it records is subtracted from every channel. Here one simulated auditory ERP (N1, P2 and P3) is shown under each common choice. Only a simulation can show the reference at infinity.</p>`,
  labReference,
  ["Start with Vertex (Cz), the reference the net uses during recording. Cz is flat, and the N1 at 100 ms looks small at central sites. Switch to Infinity and compare.","Switch to Average and change what the average is taken over. Watch the signal subtracted from every channel grow when the lower head is missing.","Check Pz minus Fz under each reference. It does not change. Then try Surface Laplacian and compare the map with Infinity at the N1 and at the P3."],
  "Re-referencing subtracts one signal from every channel. It changes how the data are expressed, not the data: differences between sites are preserved. The vertex reference hides activity near the vertex. Linked mastoids pick up temporal activity. The average reference assumes even, complete coverage of the head. The surface Laplacian is reference free; it emphasizes local activity and suppresses broad fields.");
PAGES.layout=labPage(SEC('layout'),
  `<p class="lead">A channel name only means something with its position attached. The 10-20 system places electrodes at 10% and 20% steps between skull landmarks, so positions scale with head size. The 10-10 system fills in the gaps. Geodesic nets like the GSN 128 and 256 tile the head evenly and reach the cheeks and neck, which classic caps do not.</p>`,
  labLayout,
  ["Look at the midline view, then the ear-to-ear view. Turn on the 10-10 positions and see how they split each 20% step.","Hover electrodes in the geodesic 128 layout to find the nearest 10-10 name. Most sensors have no exact 10-20 equivalent.","Compare the open circles below ear level in the 128 and 256 layouts. Those are the channels that make an average reference closer to complete, and they are often the noisiest."],
  "Positions, not names, carry the meaning. 10-20 and 10-10 positions are proportional to each head, while geodesic nets are defined by the net's own sensor map. Always analyze with the layout file for the exact net and size used, and report it with the reference.");
PAGES.reading=(page)=>{
  page.innerHTML=`
    <header class="head"><span class="eyebrow">Module 2 · Synthesis</span><h1>Reading a scalp channel</h1>
      <div class="prose"><p class="lead">Put the labs together and every channel value carries three things: a mixture of many sources, a reference that is subtracted from it, and a position that defines what it means.</p></div></header>
    <section class="panel"><h3>What one number means</h3>

  const i=ORDER.indexOf(id);
  if(i>=0){ const prev=ORDER[i-1], next=ORDER[i+1]; const pg=document.createElement('nav'); pg.className='pager'; pg.setAttribute('aria-label','Section navigation');
    const lbl=x=>{ const a=modOf(x), b=modOf(id); const t=titleOf(x); return (a&&b&&a!==b&&!t.startsWith('Module'))?'Module '+a.n+' · '+t:t; };
    pg.innerHTML=(prev?`<a href="#${prev}" data-go="${prev}"><span class="eyebrow">Previous</span><b>${esc(lbl(prev))}</b></a>`:'')+(next?`<a class="next" href="#${next}" data-go="${next}"><span class="eyebrow">Next</span><b>${esc(lbl(next))}</b></a>`:'');
    page.appendChild(pg); }
  if(SEC(id)){ store.data.visited[id]=true; store.save(); }
  renderNav(id); updateProgress();
  $('#topTitle').textContent=titleOf(id);
  $('#side').classList.remove('open');
  if(push){ try{ history.replaceState(null,'','#'+id); }catch(e){} window.scrollTo(0,0); }
}
document.addEventListener('click',e=>{ const a=e.target.closest('[data-go]'); if(!a) return; e.preventDefault(); go(a.dataset.go,true); });
window.addEventListener('hashchange',()=>{ const id=location.hash.slice(1); if(id&&id!==current) go(id,false); });
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#side').classList.remove('open'); });
go((location.hash||'#overview').slice(1), false);
</script>
