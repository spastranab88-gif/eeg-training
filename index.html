<title>EEG Fellows Training</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Open-source interactive training platform for EEG fellows. Theory Track, Module 1: Origin of the EEG signal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,500&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: course sidebar (modules + sections) beside a single reading column; labs widen to full column with canvas stages. */
:root{
  --bg:#f1f4f6; --surface:#ffffff; --sunk:#e7ecf0; --ink:#132130; --muted:#566476; --line:#d5dce4;
  --accent:#0d6a6f; --accent-soft:#d9eeee; --accent-ink:#ffffff;
  --pos:#c4453a; --neg:#2d61b0; --neutral:#eef2f5; --warn:#9a6210; --ok:#2c7547;
  --f-display:"Spectral", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px; --side:270px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1219; --surface:#131b25; --sunk:#0f1620; --ink:#e3e9f0; --muted:#8f9fb2; --line:#233040;
  --accent:#4cb1ac; --accent-soft:#16302f; --accent-ink:#04201e;
  --pos:#ee7b6e; --neg:#6b9fee; --neutral:#1a2430; --warn:#e0a54a; --ok:#6cc08a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c1219; --surface:#131b25; --sunk:#0f1620; --ink:#e3e9f0; --muted:#8f9fb2; --line:#233040;
  --accent:#4cb1ac; --accent-soft:#16302f; --accent-ink:#04201e;
  --pos:#ee7b6e; --neg:#6b9fee; --neutral:#1a2430; --warn:#e0a54a; --ok:#6cc08a; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font:15px/1.6 var(--f-body); -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
h1,h2,h3{font-family:var(--f-display); font-weight:600; line-height:1.2; text-wrap:balance; margin:0}
h1{font-size:clamp(28px,4vw,40px); letter-spacing:-.01em}
h2{font-size:24px}
h3{font-size:18px}
p{margin:0}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.eyebrow{font:600 11.5px/1 var(--f-body); letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}

/* shell */
.shell{display:grid; grid-template-columns:var(--side) minmax(0,1fr); min-height:100%}
.side{position:sticky; top:env(safe-area-inset-top,0px); height:calc(100vh - env(safe-area-inset-top,0px)); overflow:auto; background:var(--surface); border-right:1px solid var(--line); padding-block:20px 28px; padding-left:max(18px, env(safe-area-inset-left,0px)); padding-right:18px; display:flex; flex-direction:column; gap:22px}
.brand{display:flex; gap:10px; align-items:center}
.brand svg{flex:none}
.brand b{display:block; font:600 17px/1.15 var(--f-display)}
.brand span{font-size:12px; color:var(--muted)}
.nav-group{display:flex; flex-direction:column; gap:2px}
.nav-group .eyebrow{margin:0 0 8px 8px}
.nav a{display:flex; align-items:flex-start; gap:10px; padding:7px 8px; border-radius:7px; color:var(--ink); text-decoration:none; font-size:14px; line-height:1.35}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent-soft); color:var(--ink); font-weight:600}
.nav .tick{flex:none; width:16px; height:16px; margin-top:1px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center}
.nav .tick.done{background:var(--accent); border-color:var(--accent)}
.nav .tick.done::after{content:""; width:6px; height:3.5px; border:solid var(--accent-ink); border-width:0 0 1.6px 1.6px; transform:rotate(-45deg) translate(1px,-1px)}
.nav .mod{font-weight:600}
.nav .sub{padding-left:34px; font-size:13.5px}
.nav .lock{font-size:11px; color:var(--muted); margin-left:auto; white-space:nowrap}
.side-foot{margin-top:auto; font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:6px}
.progress{height:6px; border-radius:6px; background:var(--sunk); overflow:hidden}
.progress i{display:block; height:100%; background:var(--accent); width:0; transition:width .4s}

.topbar{display:none}
main{min-width:0; padding-block:36px 80px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.page{max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:28px}
.prose{max-width:68ch; display:flex; flex-direction:column; gap:12px}
.lead{font-size:17px; color:var(--muted)}
.head{display:flex; flex-direction:column; gap:12px}
.meta-row{display:flex; flex-wrap:wrap; gap:8px 18px; font-size:13px; color:var(--muted)}
.meta-row b{color:var(--ink); font-weight:600}

/* cards and panels */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px}
.panel > h3{margin-bottom:12px}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.list{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px}
.callout{border-left:3px solid var(--accent); padding:4px 0 4px 16px; display:flex; flex-direction:column; gap:4px; max-width:72ch}
.callout b{font-weight:600}

/* lab */
.lab{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.lab-bar{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line)}
.lab-bar .grow{flex:1}
.stage{position:relative; background:var(--surface)}
.stage canvas{display:block; width:100%; touch-action:none}
.stage.scroll canvas{touch-action:pan-y}
.stage + .stage{border-top:1px solid var(--line)}
.lab-foot{display:flex; flex-wrap:wrap; gap:14px 28px; padding:14px 16px; border-top:1px solid var(--line); background:var(--sunk)}
.readout{display:flex; flex-direction:column; gap:2px; min-width:0}
.readout .eyebrow{font-size:10.5px}
.readout .v{font:500 15px/1.3 var(--f-mono); font-variant-numeric:tabular-nums}
.split{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.split > .stage + .stage{border-top:0; border-left:1px solid var(--line)}
.split.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.tri{display:grid; grid-template-columns:repeat(3,minmax(0,1fr))}
.tri > .stage + .stage{border-left:1px solid var(--line); border-top:0}
.fit{font:600 26px/1 var(--f-mono)}
.note-box{border-top:1px solid var(--line); padding:14px 16px; background:var(--accent-soft); font-size:14px}
.controls{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px 20px; padding:16px}
.ctl{display:flex; flex-direction:column; gap:6px; min-width:0}
.ctl label, .ctl .lbl{font-size:12.5px; font-weight:600; display:flex; justify-content:space-between; gap:8px}
.ctl label output, .ctl .lbl output{font:500 12.5px var(--f-mono); color:var(--muted)}
input[type=range]{width:100%; accent-color:var(--accent)}
.seg{display:inline-flex; flex-wrap:wrap; background:var(--sunk); border-radius:8px; padding:3px; gap:2px}
.seg button{border:0; background:transparent; padding:6px 11px; border-radius:6px; font-size:13px; cursor:pointer; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line); background:var(--surface); padding:7px 13px; border-radius:7px; cursor:pointer; font-size:13.5px; font-weight:500; display:inline-flex; align-items:center; gap:6px; text-decoration:none; color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.ghost{border-color:transparent; background:transparent}
.btn.danger{color:var(--pos)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:5px 11px; font-size:12.5px; cursor:pointer; color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); font-weight:600}
.check{display:flex; gap:8px; align-items:center; font-size:13px; cursor:pointer}
.check input{accent-color:var(--accent); width:15px; height:15px}
.legend{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted)}
.legend .bar{width:110px; height:8px; border-radius:4px}
.try{display:flex; flex-direction:column; gap:8px}
.try ol{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px}
.tag{display:inline-block; font:500 11px/1.4 var(--f-mono); padding:1px 7px; border-radius:4px; background:var(--sunk); color:var(--muted)}
.tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--surface); font:500 12px/1.3 var(--f-mono); padding:5px 8px; border-radius:5px; white-space:nowrap; transform:translate(-50%, -130%)}

/* objectives / outline */
.obj{display:flex; flex-direction:column; gap:4px}
.obj label{display:flex; gap:12px; align-items:flex-start; padding:9px 10px; border-radius:8px; cursor:pointer}
.obj label:hover{background:var(--sunk)}
.obj input{margin-top:4px; accent-color:var(--accent); width:16px; height:16px; flex:none}
.outline{display:flex; flex-direction:column}
.outline a{display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:12px; align-items:baseline; padding:12px 4px; border-top:1px solid var(--line); text-decoration:none; color:var(--ink)}
.outline a:first-child{border-top:0}
.outline a:hover b{color:var(--accent)}
.outline .n{font:500 13px var(--f-mono); color:var(--muted)}
.outline b{font-weight:600; display:block}
.outline span.d{color:var(--muted); font-size:13.5px}
.reading{display:flex; flex-direction:column; gap:3px; padding:10px 0; border-top:1px solid var(--line)}
.reading:first-of-type{border-top:0}
.reading i{font-family:var(--f-display); font-size:16px}

/* quiz */
.q{display:flex; flex-direction:column; gap:10px; padding:18px 0; border-top:1px solid var(--line)}
.q:first-child{border-top:0; padding-top:0}
.q .opts{display:flex; flex-direction:column; gap:6px}
.q .opt{text-align:left; border:1px solid var(--line); background:var(--surface); padding:9px 12px; border-radius:8px; cursor:pointer; font-size:14px}
.q .opt:hover{border-color:var(--muted)}
.q .opt.right{border-color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, var(--surface))}
.q .opt.wrong{border-color:var(--pos); background:color-mix(in srgb, var(--pos) 10%, var(--surface))}
.q .why{font-size:14px; color:var(--muted); border-left:3px solid var(--line); padding-left:12px}
.score{font:600 14px var(--f-mono)}

textarea{width:100%; min-height:110px; resize:vertical; border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--surface); line-height:1.5}
input[type=text], input[type=url], select{border:1px solid var(--line); border-radius:7px; padding:7px 10px; background:var(--surface); width:100%; min-width:0}

/* media */
.media-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px}
.mcard{display:flex; flex-direction:column; gap:8px; border:1px solid var(--line); border-radius:9px; padding:12px; background:var(--surface); text-align:left; cursor:pointer; min-width:0}
.mcard:hover{border-color:var(--muted)}
.mcard .kind{font:600 10.5px/1 var(--f-mono); letter-spacing:.06em; text-transform:uppercase; padding:4px 6px; border-radius:4px; align-self:flex-start}
.kind.slides{background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent)}
.kind.video{background:color-mix(in srgb, var(--pos) 15%, transparent); color:var(--pos)}
.kind.image{background:color-mix(in srgb, var(--neg) 15%, transparent); color:var(--neg)}
.kind.link{background:var(--sunk); color:var(--muted)}
.mcard b{font-weight:600; font-size:14px; overflow-wrap:anywhere}
.mcard small{color:var(--muted); font-size:12px}
.empty{border:1.5px dashed var(--line); border-radius:10px; padding:26px; text-align:center; color:var(--muted); display:flex; flex-direction:column; gap:8px; align-items:center}
.drop.over{border-color:var(--accent); background:var(--accent-soft)}
.notice{font-size:13px; padding:10px 12px; border-radius:8px; background:var(--sunk); color:var(--muted)}
.notice.err{background:color-mix(in srgb, var(--pos) 12%, var(--surface)); color:var(--ink)}
.overlay{position:fixed; inset:0; background:rgba(5,10,16,.72); z-index:50; display:flex; align-items:center; justify-content:center; padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.viewer{background:var(--surface); border-radius:12px; width:min(1000px,100%); max-height:100%; display:flex; flex-direction:column; overflow:hidden}
.viewer-head{display:flex; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line)}
.viewer-head b{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.viewer-body{flex:1; min-height:0; overflow:auto; background:var(--sunk); display:flex; align-items:center; justify-content:center; padding:12px}
.viewer-body video, .viewer-body img, .viewer-body canvas{max-width:100%; max-height:72vh; display:block; border-radius:6px; background:#000}
.viewer-body img, .viewer-body canvas{background:#fff}
.viewer-foot{display:flex; gap:10px; align-items:center; justify-content:center; padding:10px; border-top:1px solid var(--line)}
.related{display:flex; flex-direction:column; gap:10px}

.pager{display:flex; justify-content:space-between; gap:12px; border-top:1px solid var(--line); padding-top:20px}
.pager a{display:flex; flex-direction:column; gap:2px; text-decoration:none; color:var(--ink); max-width:48%}
.pager a.next{text-align:right; margin-left:auto}
.pager a b{font-family:var(--f-display); font-size:17px; font-weight:600}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed; z-index:40; inset:0 auto 0 0; width:min(320px,86vw); height:100%; transform:translateX(-102%); transition:transform .25s; box-shadow:0 0 40px rgba(0,0,0,.25); padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .topbar{display:flex; position:sticky; top:env(safe-area-inset-top,0px); z-index:20; align-items:center; gap:10px; background:var(--surface); border-bottom:1px solid var(--line); padding-block:10px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
  .topbar b{font:600 16px var(--f-display); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  main{padding-top:24px}
  .split{grid-template-columns:minmax(0,1fr)}
  .split > .stage + .stage{border-left:0; border-top:1px solid var(--line)}
  .split.even{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){ .grid2,.grid3,.tri{grid-template-columns:minmax(0,1fr)} .tri > .stage + .stage{border-left:0; border-top:1px solid var(--line)} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="topbar">
  <button class="btn" id="menuBtn" aria-label="Open course contents">Contents</button>
  <b id="topTitle">EEG Fellows Training</b>
</div>
<div class="shell">
  <aside class="side" id="side" aria-label="Course contents">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="var(--accent)"/><path d="M4 19h5l2-6 3 12 3-17 3 14 2-5h8" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>EEG Fellows Training</b><span>Theory Track</span></div>
    </div>
    <nav class="nav nav-group" id="nav"></nav>
    <div class="side-foot">
      <div style="display:flex;justify-content:space-between"><span id="progLbl">Module 1 progress</span><span class="mono" id="progTxt">0%</span></div>
      <div class="progress"><i id="progBar"></i></div>
      <span>Progress and notes stay in this browser.</span>
    </div>
  </aside>
  <main id="main"><div class="page" id="page"></div></main>
</div>

<script>
/* =========================================================================
   COURSE CONTENT
   Edit this object to add modules and sections. Each section has an id
   (used in the link, e.g. #synchrony), a title and a renderer name.
   STATIC_MEDIA lets a self-hosted copy list files kept in a /media folder.
   ========================================================================= */
const COURSE = {
  title: "EEG Fellows Training",
  modules: [
    { id:"m1", n:1, title:"Origin of the EEG signal", status:"live",
      summary:"Scalp EEG mainly reflects synchronized postsynaptic currents in aligned pyramidal neurons, summed over several square centimeters of cortex. By the end of this module, fellows can say why some brain activity is visible at the scalp, and most is not.",
      sections:[
        {id:"overview",  title:"Overview", kind:"Start here"},
        {id:"membrane",  title:"From membrane to field", kind:"Lab 1"},
        {id:"synchrony", title:"Synchrony and summation", kind:"Lab 2"},
        {id:"fields",    title:"Open and closed fields", kind:"Lab 3"},
        {id:"folding",   title:"Orientation and folding", kind:"Lab 4"},
        {id:"scalp",     title:"The view from the scalp", kind:"Lab 5"},
        {id:"misses",    title:"What EEG misses", kind:"Synthesis"},
        {id:"check",     title:"Misconceptions check", kind:"Quiz"},
        {id:"discussion",title:"Discussion", kind:"Seminar"}
      ]},
    { id:"m2", n:2, title:"Volume conduction, reference and montage", status:"live",
      summary:"Every scalp channel is a blurred, reference-dependent mixture of many sources, so no waveform can be read as \"the activity under that electrode.\" This module covers the blurring (volume conduction), the source localization problem it creates, and what a reference does to the data.",
      sections:[
        {id:"m2",        title:"Overview", kind:"Start here"},
        {id:"conduction",title:"Volume conduction", kind:"Lab 1"},
        {id:"inverse",   title:"Forward and inverse problems", kind:"Lab 2"},
        {id:"density",   title:"What high density buys", kind:"Lab 3"},
        {id:"reference", title:"Choosing a reference", kind:"Lab 4"},
        {id:"layout",    title:"Montage and layout", kind:"Lab 5"},
        {id:"reading",   title:"Reading a scalp channel", kind:"Synthesis"},
        {id:"m2-check",  title:"Misconceptions check", kind:"Quiz"},
        {id:"m2-discussion", title:"Discussion", kind:"Seminar"}
      ]},
    { id:"m3", n:3, title:"Applications", status:"planned",
      summary:"EEG in the context of other neuroimaging modalities, rhythm generation, and uses across pain, cognitive and motor neuroscience.",
      points:["Advantages and disadvantages compared with other modalities","Clinically approved applications","Resting state versus task-based protocols","Sources and functional roles of each rhythm","Evoked versus induced activity","Uses in pain, cognitive and motor neuroscience"]},
    { id:"m4", n:4, title:"Signal fundamentals", status:"planned",
      summary:"Filters and sampling choices change the waveform you see, so every setting has to be understood and documented before it is applied.",
      points:["Sampling, aliasing and the Nyquist frequency","Signals as sums of sinusoids; reading a power spectrum","High-pass, low-pass, band-pass and notch filters","Transition bandwidth, ringing and phase distortion","How aggressive high-pass filtering distorts slow ERP components"]},
    { id:"p1", n:"P1", title:"Practical: EEG data collection", status:"planned",
      summary:"Hands-on recording with the lab's nets and protocols.", points:["Net application and impedance","Recording protocols and documentation"]},
    { id:"p2", n:"P2", title:"Practical: EEG analysis", status:"planned",
      summary:"Preprocessing and analysis pipelines in MNE-Python.", points:["Preprocessing and artifact handling","Spectral and ERP analysis"]}
  ]
};
const STATIC_MEDIA = [
  /* Example for a self-hosted copy:
  { module:"m1", section:"membrane", kind:"slides", title:"Session 1 slides", src:"media/m1-session1.pdf" },
  { module:"m1", section:"general",  kind:"video",  title:"Recorded lecture", src:"media/m1-lecture.mp4" },
  */
];

/* =========================================================================
   STATE (per viewer, browser storage)
   ========================================================================= */
const store = {
  key:"eegft-v1",
  data:{visited:{}, obj:{}, quiz:{}, notes:{}},
  load(){ try{ const s=localStorage.getItem(this.key); if(s) Object.assign(this.data, JSON.parse(s)); }catch(e){} },
  save(){ try{ localStorage.setItem(this.key, JSON.stringify(this.data)); }catch(e){} }
};
store.load();

/* =========================================================================
   THEME COLORS FOR CANVAS
   ========================================================================= */
const C = {};
function hexRGB(h){ h=h.trim().replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function readColors(){
  const cs=getComputedStyle(document.documentElement);
  ['bg','surface','sunk','ink','muted','line','accent','pos','neg','neutral'].forEach(k=>{ C[k]=cs.getPropertyValue('--'+k).trim(); C[k+'RGB']=hexRGB(C[k]); });
}
readColors();
const themeListeners = new Set();
function onTheme(){ readColors(); themeListeners.forEach(f=>f()); }
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme); }catch(e){}
new MutationObserver(onTheme).observe(document.documentElement,{attributes:true, attributeFilter:['data-theme','class','style']});

function cmap(v){
  const t=Math.max(-1,Math.min(1,v)); const a=Math.pow(Math.abs(t),0.8);
  const T=t>=0?C.posRGB:C.negRGB, N=C.neutralRGB;

/* =========================================================================

   ========================================================================= */
function labMembrane(root){
  root.innerHTML = `
  <div class="lab">
    <div class="lab-bar">

      <label class="check"><input type="checkbox" id="m1slow"> Slow motion</label>

    </div>

    <div class="stage scroll"><canvas id="m1tr" aria-label="Voltage traces at the electrode and at a distant probe"></canvas></div>
    <div class="lab-foot">
      <div class="readout"><span class="eyebrow">Electrode to soma</span><span class="v" id="m1dist">0 µm</span></div>
      <div class="readout"><span class="eyebrow">Peak at electrode</span><span class="v" id="m1pk">0</span></div>
      <div class="readout"><span class="eyebrow">Peak at distant probe</span><span class="v" id="m1pf">0</span></div>

  let events=[], geo, el=null, far=null, particles=[];

  const AP_Q=9, S=7, UM=2; // µm per px
  function layout(){

  function alpha(dt,tau){ return dt<=0?0:(dt/tau)*Math.exp(1-dt/tau); }

        out.push({x:x0,y:yTop+14,q:-I});
        out.push({x:x0,y:ySoma-16,q:I*0.4},{x:x0-16,y:ySoma+10,q:I*0.3},{x:x0+16,y:ySoma+10,q:I*0.3});
      }
      if(e.type==='ap' && dt>=0 && dt<4){
        const dur=3, y0=ySoma+22; const y=y0+(yAx-y0)*Math.min(1,dt/dur);

  }
  function V(x,y,src){ let v=0; for(const s of src){ v+=s.q/Math.hypot(x-s.x,y-s.y,S); } return v; }
  function trigger(at){

  }
  bindSeg(root,'m1mode',v=>{ mode=v; events=[]; nextTrig=t+2; });

  $('#m1play',root).onclick=e=>{ playing=!playing; e.target.textContent=playing?'Pause':'Play'; };
  $('#m1fire',root).onclick=()=>{ trigger(t+0.5); if(!playing){ playing=true; $('#m1play',root).textContent='Pause'; } };

  function drawNeuron(ctx){

    ctx.strokeStyle=C.ink; ctx.fillStyle=C.ink; ctx.lineCap='round';

    ctx.lineWidth=3; ctx.beginPath();
    [[-34,-22],[30,-26],[-14,-34],[14,-30]].forEach(([dx,dy])=>{ ctx.moveTo(x0,yTop+18); ctx.lineTo(x0+dx,yTop+18+dy); });
    ctx.moveTo(x0,yTop+80); ctx.lineTo(x0-26,yTop+58); ctx.moveTo(x0,yTop+110); ctx.lineTo(x0+28,yTop+86);

    ctx.fillStyle=C.muted; ctx.beginPath(); ctx.arc(x0+10,yTop+11,4.5,0,7); ctx.fill();

    const ctx=st.ctx, {w,h}=st; const src=sources(t);
    ctx.fillStyle=C.neutral; ctx.fillRect(0,0,w,h);
    const anyActive=src.some(s=>Math.abs(s.q)>0.01);
    if(anyActive) drawHeat(st,heat,7,(x,y)=>compress(V(x,y,src),0.02));
    drawNeuron(ctx);

    // intracellular current along dendrite
    const ep=src.length? src.filter(s=>s.q<0 && Math.abs(s.y-(yTop+14))<1)[0]:null;
    if(ep){ const I=-ep.q; const n=7; ctx.fillStyle=rgb(C.posRGB,Math.min(1,I*1.2));
      for(let k=0;k<n;k++){ const f=((k/n)+t*0.02)%1; const y=yTop+20+f*(ySoma-yTop-44); ctx.beginPath(); ctx.arc(x0,y,2.6,0,7); ctx.fill(); } }

      const pos=src.filter(s=>s.q>0); for(let k=0;k<3;k++){ const s=pos[Math.floor(Math.random()*pos.length)]; const a=Math.random()*6.28; particles.push({x:s.x+Math.cos(a)*12,y:s.y+Math.sin(a)*12,life:0}); }
    }

    label(ctx,'axon',x0+8,h-12);

/* =========================================================================

function labSynchrony(root){
  const NVALS=[10,30,100,300,1000,3000];
  root.innerHTML = `

  </div>`;
  const rnd=seeded(7); const U=new Float32Array(3000).map(()=>rnd()*2-1);
  const rnd2=seeded(99); const U2=new Float32Array(3000).map(()=>rnd2()*2-1);
  const sc=[{name:'A', ni:4, sync:0, u:U},{name:'B', ni:2, sync:92, u:U2}];
  const cards=$('#s2cards',root);
  cards.innerHTML=sc.map((s,i)=>`
    <div class="lab">
      <div class="lab-bar"><b style="font-family:var(--f-display);font-size:17px">Population ${s.name}</b><span class="grow"></span><span class="mono" id="s2amp${i}" style="font-size:13px"></span></div>
      <div class="stage scroll"><canvas id="s2cv${i}" aria-label="Population ${s.name} traces"></canvas></div>
      <div class="controls" style="grid-template-columns:1fr">
        <div class="ctl"><label for="s2n${i}">Active neurons <output id="s2no${i}"></output></label><input type="range" id="s2n${i}" min="0" max="5" step="1" value="${s.ni}"></div>
        <div class="ctl"><label for="s2s${i}">Synchrony <output id="s2so${i}"></output></label><input type="range" id="s2s${i}" min="0" max="100" step="1" value="${s.sync}"></div>
      </div>
    </div>`).join('');
  function amp(s){ const N=NVALS[s.ni]; let re=0,im=0; const spread=Math.PI*(1-s.sync/100); for(let k=0;k<N;k++){ const p=s.u[k]*spread; re+=Math.cos(p); im+=Math.sin(p);} return {N,R:Math.hypot(re,im),ph:Math.atan2(im,re),spread}; }
  const cvs=sc.map((s,i)=>setupCanvas($('#s2cv'+i,root), w=>Math.max(220,Math.min(280,w*0.62))));
  let time=0, paused=reduceMotion; $('#s2pause',root).checked=paused;
  function update(){
    sc.forEach((s,i)=>{ s.a=amp(s); $('#s2no'+i,root).textContent=s.a.N.toLocaleString(); $('#s2so'+i,root).textContent=s.sync+'%';
      $('#s2amp'+i,root).textContent=`sum = ${s.a.R.toFixed(0)}× one cell`; });
    const r=sc[1].a.R/Math.max(1e-9,sc[0].a.R);

    $('#s2msg',root).textContent=`A: ${sc[0].a.N.toLocaleString()} cells at ${sc[0].sync}% synchrony sum to ${sc[0].a.R.toFixed(0)}. B: ${sc[1].a.N.toLocaleString()} cells at ${sc[1].sync}% sum to ${sc[1].a.R.toFixed(0)}. Random phases grow like √N (√${sc[0].a.N.toLocaleString()} ≈ ${Math.sqrt(sc[0].a.N).toFixed(0)}); aligned phases grow like N.`;
  }
  sc.forEach((s,i)=>{ $('#s2n'+i,root).oninput=e=>{s.ni=+e.target.value; update();}; $('#s2s'+i,root).oninput=e=>{s.sync=+e.target.value; update();}; });
  $('#s2reset',root).onclick=()=>{ sc[0].ni=4; sc[0].sync=0; sc[1].ni=2; sc[1].sync=92; sc.forEach((s,i)=>{$('#s2n'+i,root).value=s.ni; $('#s2s'+i,root).value=s.sync;}); update(); };
  $('#s2pause',root).onchange=e=>paused=e.target.checked;

    const mono=getComputedStyle(document.body).getPropertyValue('--f-mono');
    sc.forEach((s,i)=>{
      const {ctx,w,h}=cvs[i]; ctx.fillStyle=C.surface; ctx.fillRect(0,0,w,h);
      const f=10, win=0.4; const x0=44, x1=w-10;
      ctx.font='500 10.5px '+mono; ctx.fillStyle=C.muted; ctx.textAlign='left';
      ctx.fillText('5 example cells',x0,14);
      const rowH=(h*0.42-20)/5;
      for(let k=0;k<5;k++){
        const y0=22+rowH*(k+.5); const p=s.u[k]*s.a.spread;
        ctx.strokeStyle=rgb(C.inkRGB,0.55); ctx.lineWidth=1.2; ctx.beginPath();
        for(let x=x0;x<=x1;x+=2){ const tt=time+(x-x0)/(x1-x0)*win; const y=y0-Math.sin(2*Math.PI*f*tt+p)*rowH*0.38; x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
        ctx.stroke();
      }
      const top=h*0.46, base=top+(h-top-22)/2, half=(h-top-22)/2;
      ctx.strokeStyle=C.line; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x0,base); ctx.lineTo(x1,base); ctx.stroke();
      ctx.setLineDash([3,4]); [half,-half].forEach(d=>{ctx.beginPath(); ctx.moveTo(x0,base-d); ctx.lineTo(x1,base-d); ctx.stroke();}); ctx.setLineDash([]);
      ctx.fillStyle=C.muted; ctx.textAlign='right'; ctx.fillText('+'+ymax.toFixed(0),x0-6,base-half+4); ctx.fillText('0',x0-6,base+4); ctx.fillText('−'+ymax.toFixed(0),x0-6,base+half+4);
      ctx.textAlign='left'; ctx.fillStyle=C.accent; ctx.fillText('summed signal (shared scale)',x0,top+2);
      ctx.strokeStyle=C.accent; ctx.lineWidth=2.2; ctx.beginPath();
      for(let x=x0;x<=x1;x+=2){ const tt=time+(x-x0)/(x1-x0)*win; const y=base-Math.sin(2*Math.PI*f*tt+s.a.ph)*s.a.R/ymax*half; x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
      ctx.stroke();
      ctx.fillStyle=C.muted; ctx.textAlign='right'; ctx.fillText('400 ms',x1,h-6);
    });
  }
  const stop=rafLoop(dt=>{ if(!paused) time+=dt/1000*0.25; draw(); });
  return ()=>{ stop(); cvs.forEach(c=>c.destroy()); };
}

/* =========================================================================
   LAB 3: OPEN AND CLOSED FIELDS
   Geometry in model units (700 wide), drawn with a scale factor.
   ========================================================================= */
function labFields(root){
  root.innerHTML=`
  <div class="lab">
    <div class="lab-bar">${seg('f3arr',[['open','Parallel pyramidal cells'],['stellate','Stellate cell'],['nucleus','Radial nucleus'],['random','Random orientations']],'open')}</div>
    <div class="split">
      <div class="stage"><canvas id="f3cv" aria-label="Potential map around a cell arrangement"></canvas></div>
      <div class="stage scroll"><canvas id="f3fo" aria-label="Potential versus distance for each arrangement"></canvas></div>
    </div>
    <div class="lab-foot">
      <div class="readout"><span class="eyebrow">Field type</span><span class="v" id="f3type">Open</span></div>
      <div class="readout"><span class="eyebrow">Potential at probe</span><span class="v" id="f3val">0</span></div>
      <div class="readout"><span class="eyebrow">Probe distance</span><span class="v" id="f3dist">0</span></div>
      <div class="legend"><span>−</span><span class="bar" style="background:${legendCSS()}"></span><span>+</span></div>
    </div>
  </div>`;
  const cv=$('#f3cv',root), fo=$('#f3fo',root);
  const st=setupCanvas(cv,w=>Math.max(300,Math.min(440,w*0.82)));
  const fst=setupCanvas(fo,w=>Math.max(260,Math.min(440,w*0.82)));
  const heat=makeHeat(); let arr='open'; let probe={u:0,v:-150}; // model units, origin = center
  function build(a){
    const cells=[]; // each {sx,sy, kx,ky} source (soma) and sink (dendrite end), unit current
    if(a==='open'){ for(let i=-4;i<=4;i++) cells.push({sx:i*30,sy:40,kx:i*30,ky:-50}); }
    if(a==='random'){ const r=seeded(5); for(let i=-4;i<=4;i++){ const ang=r()*Math.PI*2; cells.push({sx:i*30,sy:0,kx:i*30+Math.cos(ang)*90,ky:Math.sin(ang)*90}); } }
    if(a==='stellate'){ const n=10; for(let k=0;k<n;k++){ const ang=k/n*Math.PI*2; cells.push({sx:0,sy:0,kx:Math.cos(ang)*70,ky:Math.sin(ang)*70,w:0.9}); } }
    if(a==='nucleus'){ const n=12; for(let k=0;k<n;k++){ const ang=k/n*Math.PI*2+0.2; cells.push({sx:Math.cos(ang)*36,sy:Math.sin(ang)*36,kx:Math.cos(ang)*110,ky:Math.sin(ang)*110}); } }
    return cells;
  }
  const S0=8;
  function Vat(cells,u,v){ let s=0; for(const c of cells){ const w=c.w||1; s+=w*(1/Math.hypot(u-c.sx,v-c.sy,S0)-1/Math.hypot(u-c.kx,v-c.ky,S0)); } return s; }
  const falloff={};
  ['open','stellate','nucleus','random'].forEach(a=>{ const cells=build(a); const pts=[]; for(let i=0;i<=60;i++){ const d=60*Math.pow(3000/60,i/60); pts.push([d, Math.abs(Vat(cells,0,-d))+1e-12]); } falloff[a]=pts; });
  let cells=build(arr);
  function sc(){ return Math.min(st.w,st.h*1.05)/440; }
  function toPx(u,v){ const s=sc(); return [st.w/2+u*s, st.h*0.52+v*s]; }
  function toU(x,y){ const s=sc(); return [(x-st.w/2)/s,(y-st.h*0.52)/s]; }
  function draw(){
    const ctx=st.ctx,{w,h}=st; ctx.fillStyle=C.neutral; ctx.fillRect(0,0,w,h);
    drawHeat(st,heat,4,(x,y)=>{ const [u,v]=toU(x,y); return compress(Vat(cells,u,v),0.12); });
    // contour-ish iso lines are skipped; draw cells
    ctx.lineCap='round';
    for(const c of cells){ const [a,b]=toPx(c.sx,c.sy), [p,q]=toPx(c.kx,c.ky);
      ctx.strokeStyle=C.ink; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(a,b); ctx.lineTo(p,q); ctx.stroke();
      ctx.fillStyle=C.ink; ctx.beginPath(); ctx.arc(a,b,4.5,0,7); ctx.fill(); }
    if(arr==='stellate'){ const [a,b]=toPx(0,0); ctx.fillStyle=C.ink; ctx.beginPath(); ctx.arc(a,b,8,0,7); ctx.fill(); }
    if(arr==='open'||arr==='random'){ const mono=getComputedStyle(document.body).getPropertyValue('--f-mono'); ctx.font='500 11px '+mono; ctx.fillStyle=C.muted; ctx.textAlign='left'; if(arr==='open'){ const [a,b]=toPx(-128,-52); ctx.textAlign='right'; ctx.fillText('dendrites (sinks)',a-8,b+4); const [c,d]=toPx(-128,40); ctx.fillText('somata (sources)',c-8,d+4); } }
    // probe
    const [px,py]=toPx(probe.u,probe.v);
    ctx.strokeStyle=C.accent; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+26,py-44); ctx.stroke();
    ctx.fillStyle=C.accent; ctx.beginPath(); ctx.arc(px,py,6,0,7); ctx.fill();
    const val=Vat(cells,probe.u,probe.v);
    $('#f3val',root).textContent=(val>=0?'+':'')+val.toFixed(4);
    $('#f3dist',root).textContent=Math.round(Math.hypot(probe.u,probe.v))+' units';
    $('#f3type',root).textContent=arr==='open'?'Open field':arr==='random'?'Mostly cancels':'Closed field';
    drawFalloff();
  }
  function drawFalloff(){
    const ctx=fst.ctx,{w,h}=fst; ctx.fillStyle=C.surface; ctx.fillRect(0,0,w,h);
    const mono=getComputedStyle(document.body).getPropertyValue('--f-mono'); ctx.font='500 10.5px '+mono;
    const L=48,R=w-14,T=34,B=h-40;
    const lx=d=>L+(Math.log10(d)-Math.log10(60))/(Math.log10(3000)-Math.log10(60))*(R-L);
    const ymin=-8, ymaxL=0; const ly=v=>T+(ymaxL-Math.log10(v))/(ymaxL-ymin)*(B-T);
    ctx.fillStyle=C.ink; ctx.textAlign='left'; ctx.font='600 12px '+getComputedStyle(document.body).getPropertyValue('--f-body'); ctx.fillText('How fast each field fades with distance',L-36,18);
    ctx.font='500 10.5px '+mono;
    ctx.strokeStyle=C.line; ctx.lineWidth=1; ctx.fillStyle=C.muted; ctx.textAlign='right';
    for(let e=0;e>=ymin;e-=3){ const y=ly(Math.pow(10,e)); ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(R,y); ctx.stroke(); ctx.fillText('1e'+e,L-6,y+3); }
    ctx.textAlign='center'; [100,300,1000,3000].forEach(d=>{ const x=lx(d); ctx.beginPath(); ctx.moveTo(x,T); ctx.lineTo(x,B); ctx.stroke(); ctx.fillText(d,x,B+14); });
    ctx.fillText('distance above the cells (units, log)',(L+R)/2,B+30);
    const names={open:'pyramidal',stellate:'stellate',nucleus:'nucleus',random:'random'}; const ends=[];
    ['random','nucleus','stellate','open'].sort((a,b)=>(a===arr)-(b===arr)).forEach(a=>{
      const pts=falloff[a]; const on=a===arr;
      ctx.strokeStyle=on?C.accent:rgb(C.mutedRGB,0.55); ctx.lineWidth=on?2.6:1.4; ctx.beginPath();
      pts.forEach(([d,v],i)=>{ const x=lx(d), y=Math.min(B,ly(v)); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
      ends.push({a,on,y:Math.min(B-4,ly(pts[pts.length-1][1]))});
    });
    ends.sort((p,q)=>p.y-q.y); for(let i=1;i<ends.length;i++) if(ends[i].y-ends[i-1].y<13) ends[i].y=ends[i-1].y+13;
    ctx.textAlign='right'; ends.forEach(e=>{ ctx.fillStyle=e.on?C.accent:C.muted; ctx.fillText(names[e.a],R-2,e.y-6); });
  }
  bindSeg(root,'f3arr',v=>{ arr=v; cells=build(arr); draw(); });
  let drag=false;
  cv.addEventListener('pointerdown',e=>{ drag=true; cv.setPointerCapture(e.pointerId); const p=ptr(e,cv); const [u,v]=toU(p.x,p.y); probe={u,v}; draw(); });
  cv.addEventListener('pointermove',e=>{ if(!drag) return; const p=ptr(e,cv); const [u,v]=toU(p.x,p.y); probe={u,v}; draw(); });
  cv.addEventListener('pointerup',()=>drag=false);
  st.onresize=draw; fst.onresize=draw; themeListeners.add(draw); draw();
  return ()=>{ st.destroy(); fst.destroy(); themeListeners.delete(draw); };
}

/* =========================================================================
   LAB 4: ORIENTATION AND FOLDING (coronal slice)
   Dipoles lie along the folded cortical surface, oriented along its normal.
   ========================================================================= */
function labFolding(root){
  root.innerHTML=`
  <div class="lab">
    <div class="lab-bar">
      <div class="chips" id="g4pre">
        <button class="chip" data-p="crown" aria-pressed="true" type="button">Gyral crown</button>
        <button class="chip" data-p="wall" type="button">Sulcal wall</button>
        <button class="chip" data-p="fundus" type="button">Fundus</button>
      </div>
      <span class="grow"></span>
      <span style="font-size:12.5px;color:var(--muted)">or click anywhere on the cortex</span>
    </div>
    <div class="stage"><canvas id="g4cv" aria-label="Coronal slice of a folded cortex with a dipole"></canvas></div>
    <div class="stage scroll"><canvas id="g4sp" aria-label="Potential along the scalp"></canvas></div>
    <div class="controls">
      <div class="ctl"><label for="g4w">Active patch width <output id="g4wo"></output></label><input type="range" id="g4w" min="0" max="60" value="0"></div>
      <div class="ctl"><span class="lbl">Synaptic input</span>${seg('g4pol',[['sup','Superficial layers'],['deep','Deep layers']],'sup')}</div>
    </div>
    <div class="lab-foot">
      <div class="readout"><span class="eyebrow">Orientation</span><span class="v" id="g4or">radial</span></div>
      <div class="readout"><span class="eyebrow">Depth below scalp</span><span class="v" id="g4dep">0 mm</span></div>
      <div class="readout"><span class="eyebrow">Scalp maximum and minimum</span><span class="v" id="g4mm">0</span></div>
    </div>
  </div>`;
  const cv=$('#g4cv',root), sp=$('#g4sp',root);
  const st=setupCanvas(cv,w=>Math.max(300,Math.min(480,w*0.6)));
  const pst=setupCanvas(sp,()=>170);
  const heat=makeHeat();
  const SULCI=[-50,-20,12,44], WD=3.4, DEG=Math.PI/180;
  let G, sel=0, widthMM=0, pol=-1, selTheta=-35;
  function build(){
    const {w,h}=st; const Rs=Math.min(w*0.46,h*0.9); const cx=w/2, cy=h*0.97;
    const Rc=Rs*0.84, D=Rs*0.15; const pts=[];
    for(let i=0;i<=1200;i++){ const th=-76+152*i/1200; let r=Rc; for(const s of SULCI) r-=D*Math.exp(-Math.pow((th-s)/WD,2)); pts.push({th, x:cx+r*Math.sin(th*DEG), y:cy-r*Math.cos(th*DEG)}); }
    let cum=0; pts.forEach((p,i)=>{ if(i) cum+=Math.hypot(p.x-pts[i-1].x,p.y-pts[i-1].y); p.s=cum; });
    pts.forEach((p,i)=>{ const a=pts[Math.max(0,i-1)], b=pts[Math.min(pts.length-1,i+1)]; const tx=b.x-a.x, ty=b.y-a.y, m=Math.hypot(tx,ty)||1; p.nx=ty/m; p.ny=-tx/m; });
    // ensure outward normal at crown (between sulci)
    const c=pts[Math.round((0-(-76))/152*1200)]; if(c.nx*(c.x-cx)+c.ny*(c.y-cy)<0) pts.forEach(p=>{p.nx=-p.nx; p.ny=-p.ny;});
    const elec=[]; for(let k=0;k<41;k++){ const th=-80+160*k/40; elec.push({th,x:cx+Rs*Math.sin(th*DEG),y:cy-Rs*Math.cos(th*DEG)}); }
    G={pts,Rs,cx,cy,elec,mmPerPx:90/Rs};
    sel=idxOfTheta(selTheta);
  }
  function idxOfTheta(th){ return Math.max(0,Math.min(1200,Math.round((th+76)/152*1200))); }
  function dipoles(){
    const p0=G.pts[sel]; const W=widthMM/G.mmPerPx; const out=[];
    if(W<1){ out.push({x:p0.x,y:p0.y,mx:p0.nx*pol*12,my:p0.ny*pol*12}); return out; }
    for(let i=0;i<G.pts.length;i+=2){ const p=G.pts[i]; if(Math.abs(p.s-p0.s)<=W){ const seglen=(G.pts[Math.min(i+2,1200)].s-p.s)||1; const k=12*seglen/ (2*W) * 6; out.push({x:p.x,y:p.y,mx:p.nx*pol*k,my:p.ny*pol*k}); } }
    return out;
  }
  // potential of 2D dipole set using 3D point-dipole law (homogeneous medium)
  function Vd(dp,x,y){ let v=0; for(const d of dp){ const dx=x-d.x, dy=y-d.y; const r2=dx*dx+dy*dy+16; v+=(d.mx*dx+d.my*dy)/(r2*Math.sqrt(r2)); } return v; }
  let ref=1;
  function calibrate(){ const save=[sel,widthMM,pol]; sel=idxOfTheta(-35); widthMM=0; pol=1; const dp=dipoles(); ref=Math.max(...G.elec.map(e=>Math.abs(Vd(dp,e.x,e.y)))); [sel,widthMM,pol]=save; }
  let scalpV=[];
  function draw(){
    const ctx=st.ctx,{w,h}=st; const {pts,Rs,cx,cy}=G;
    ctx.fillStyle=C.surface; ctx.fillRect(0,0,w,h);
    const dp=dipoles();
    // field map, masked to head
    drawHeat(st,heat,5,(x,y)=>{ const r=Math.hypot(x-cx,y-cy); if(r>Rs) return null; return compress(Vd(dp,x,y)/ref,25); },235);
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,Rs,Math.PI,2*Math.PI); ctx.lineTo(cx+Rs,cy); ctx.closePath(); ctx.clip();
    // tissues
    ctx.fillStyle=rgb(C.inkRGB,0.07); ctx.beginPath(); ctx.arc(cx,cy,Rs,0,7); ctx.arc(cx,cy,Rs*0.955,0,7,true); ctx.fill();
    ctx.fillStyle=rgb(C.inkRGB,0.2); ctx.beginPath(); ctx.arc(cx,cy,Rs*0.955,0,7); ctx.arc(cx,cy,Rs*0.9,0,7,true); ctx.fill();
    // gray matter ribbon
    const T=Rs*0.045;
    ctx.fillStyle=rgb(C.inkRGB,0.13); ctx.beginPath();
    pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    for(let i=pts.length-1;i>=0;i--){ const p=pts[i]; ctx.lineTo(p.x-p.nx*T,p.y-p.ny*T); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle=rgb(C.inkRGB,0.6); ctx.lineWidth=1.4; ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke();
    ctx.strokeStyle=rgb(C.inkRGB,0.3); ctx.lineWidth=1; ctx.beginPath(); pts.forEach((p,i)=>{ const x=p.x-p.nx*T,y=p.y-p.ny*T; i?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle=rgb(C.inkRGB,0.7); ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(cx,cy,Rs,Math.PI,2*Math.PI); ctx.stroke();
    // dipole arrows
    ctx.strokeStyle=C.ink; ctx.fillStyle=C.ink; ctx.lineWidth=1.6;
    const showEvery=Math.max(1,Math.floor(dp.length/24));
    dp.forEach((d,i)=>{ if(i%showEvery) return; const m=Math.hypot(d.mx,d.my)||1; const L=dp.length===1?30:14; const ux=d.mx/m, uy=d.my/m; arrow(ctx,d.x-ux*L/2,d.y-uy*L/2,d.x+ux*L/2,d.y+uy*L/2,dp.length===1?8:5); });
    // electrodes
    scalpV=G.elec.map(e=>Vd(dp,e.x,e.y)/ref);
    G.elec.forEach((e,k)=>{ ctx.fillStyle=rgb(cmap(scalpV[k]/Math.max(1,Math.max(...scalpV.map(Math.abs))))); ctx.strokeStyle=C.surface; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(e.x,e.y,5,0,7); ctx.fill(); ctx.stroke(); });
    const mono=getComputedStyle(document.body).getPropertyValue('--f-mono'); ctx.font='500 11px '+mono; ctx.fillStyle=C.muted; ctx.textAlign='left';
    const lab=(t,r,th)=>{ ctx.fillText(t,cx+r*Math.sin(th*DEG)+6,cy-r*Math.cos(th*DEG)); };
    lab('skull',Rs*0.915,-86); lab('cortex',Rs*0.8,-80); ctx.textAlign='right'; ctx.fillText('scalp',cx-Rs*1.02*Math.sin(62*DEG)-4,cy-Rs*1.02*Math.cos(62*DEG)); ctx.textAlign='left';
    ctx.textAlign='center'; ctx.fillText('left',cx-Rs*0.95,cy-6); ctx.fillText('right',cx+Rs*0.95,cy-6);
    // readouts
    const p=pts[sel]; const rx=(p.x-cx)/Math.hypot(p.x-cx,p.y-cy), ry=(p.y-cy)/Math.hypot(p.x-cx,p.y-cy);
    const cos=p.nx*rx+p.ny*ry; const ang=Math.round(Math.acos(Math.max(-1,Math.min(1,Math.abs(cos))))/DEG);
    const kind=ang<25?'radial':ang>60?'tangential':'oblique';
    $('#g4or',root).textContent=`${kind} (${ang}° from radial)`;
    $('#g4dep',root).textContent=Math.round((Rs-Math.hypot(p.x-cx,p.y-cy))*G.mmPerPx)+' mm';
    let mx=-1e9,mn=1e9,imx=0,imn=0; scalpV.forEach((v,i)=>{ if(v>mx){mx=v;imx=i;} if(v<mn){mn=v;imn=i;} });
    $('#g4mm',root).textContent=`+${Math.max(0,mx).toFixed(2)} at ${Math.round(G.elec[imx].th)}°, ${Math.min(0,mn).toFixed(2)} at ${Math.round(G.elec[imn].th)}°`;
    $('#g4wo',root).textContent=widthMM? widthMM+' mm each way':'single point';
    drawPlot(p);
  }
  function drawPlot(p){
    const ctx=pst.ctx,{w,h}=pst; ctx.fillStyle=C.surface; ctx.fillRect(0,0,w,h);
    const mono=getComputedStyle(document.body).getPropertyValue('--f-mono'); ctx.font='500 10.5px '+mono;
    const L=52,R=w-14,T=22,B=h-34; const mid=(T+B)/2;
    const vmax=Math.max(1.05, ...scalpV.map(v=>Math.abs(v)*1.1));
    const xs=th=>L+(th+80)/160*(R-L), ys=v=>mid-v/vmax*(B-T)/2;
    ctx.strokeStyle=C.line; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(L,mid); ctx.lineTo(R,mid); ctx.stroke();
    ctx.fillStyle=C.muted; ctx.textAlign='right'; ctx.fillText('+'+vmax.toFixed(1),L-6,T+4); ctx.fillText('0',L-6,mid+4); ctx.fillText('−'+vmax.toFixed(1),L-6,B+4);
    ctx.textAlign='left'; ctx.fillText('scalp potential, relative to a single crown dipole',L,12);
    // filled curve split by sign
    ['pos','neg'].forEach(k=>{ ctx.fillStyle=rgb(C[k+'RGB'],0.28); ctx.beginPath(); ctx.moveTo(xs(-80),mid);
      G.elec.forEach((e,i)=>{ const v=scalpV[i]; ctx.lineTo(xs(e.th), ys(k==='pos'?Math.max(0,v):Math.min(0,v))); }); ctx.lineTo(xs(80),mid); ctx.closePath(); ctx.fill(); });
    ctx.strokeStyle=C.ink; ctx.lineWidth=2; ctx.beginPath(); G.elec.forEach((e,i)=>{ const x=xs(e.th), y=ys(scalpV[i]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
    // source position marker
    ctx.strokeStyle=C.accent; ctx.setLineDash([4,4]); const sx=xs(Math.max(-80,Math.min(80,p.th))); ctx.beginPath(); ctx.moveTo(sx,T); ctx.lineTo(sx,B); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=C.accent; ctx.textAlign='center'; ctx.fillText('source',sx,B+14);
    ctx.fillStyle=C.muted; ctx.textAlign='left'; ctx.fillText('left ear',L,B+28); ctx.textAlign='center'; ctx.fillText('vertex',xs(0),B+28); ctx.textAlign='right'; ctx.fillText('right ear',R,B+28);
  }
  function preset(p){
    const s=SULCI[1];
    selTheta = p==='crown'?-35 : p==='wall'? s+WD*0.72 : s;
    sel=idxOfTheta(selTheta);
    $$('#g4pre .chip',root).forEach(c=>c.setAttribute('aria-pressed',c.dataset.p===p));
    draw();
  }
  $('#g4pre',root).addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(b) preset(b.dataset.p); });
  $('#g4w',root).oninput=e=>{ widthMM=+e.target.value; draw(); };

const Media={ ready:false, mode:'loading', db:null, assets:null, user:null, canEdit:false, items:[], local:[], listeners:new Set(),
  all(){ const stat=STATIC_MEDIA.map((m,i)=>({...m,id:'static'+i,static:true})); return [...this.items, ...this.local, ...stat]; },

(async function initMedia(){
  if(!(window.claude && typeof window.claude.use==='function')){ Media.mode='static'; Media.ready=true; Media.emit(); return; }
  try{
    const [db,assets,user]=await Promise.all([claude.use('db'),claude.use('assets'),claude.use('user')]);
    Media.db=db; Media.assets=assets; Media.user=user;
    let canEdit=false; try{ canEdit = user? !!(await user.canEdit()) : false; }catch(e){}
    Media.canEdit = canEdit || !!assets;
    if(db){
      Media.mode='shared';
      db.collection('media').orderBy('addedAt','desc').onSnapshot(snap=>{
        Media.items=snap.docs.map(d=>({...d.data(), id:d.id})); Media.ready=true; Media.emit();
      }, err=>{ Media.mode='static'; Media.ready=true; Media.emit(); });
    } else { Media.mode='static'; Media.ready=true; Media.emit(); }

})();

function kindOf(file){

  if(t==='application/pdf'||n.endsWith('.pdf')) return ['slides','application/pdf'];
  if(/^image\/(png|jpeg|gif|webp)$/.test(t)) return ['image',t];
  if(t==='video/mp4'||n.endsWith('.mp4')) return ['video','video/mp4'];
  if(t==='video/webm'||n.endsWith('.webm')) return ['video','video/webm'];

const KIND_LABEL={slides:'Slides · PDF',video:'Video',image:'Image',link:'Link'};
function fmtSize(b){ if(!b) return ''; return b>1048576?(b/1048576).toFixed(1)+' MB':Math.round(b/1024)+' KB'; }
function sectionTitle(mod,sec){ const m=COURSE.modules.find(x=>x.id===mod); if(!m) return ''; if(!sec||sec==='general') return 'Module '+m.n+' · general'; const s=(m.sections||[]).find(x=>x.id===sec); return 'Module '+m.n+' · '+(s?s.title:sec); }
function mediaCard(m){
  return `<button class="mcard" type="button" data-mid="${esc(m.id)}"><span class="kind ${esc(m.kind)}">${esc(KIND_LABEL[m.kind]||m.kind)}</span><b>${esc(m.title||'Untitled')}</b><small>${esc(sectionTitle(m.module,m.section))}${m.sizeBytes?' · '+fmtSize(m.sizeBytes):''}${m.local?' · this session only':''}</small></button>`;
}

let pdfLib=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Could not load '+src)); document.head.appendChild(s); }); }
async function getPdf(){
  if(pdfLib) return pdfLib;
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await loadScript(base+'pdf.worker.min.js'); await loadScript(base+'pdf.min.js');
  pdfLib=window.pdfjsLib; pdfLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
  return pdfLib;
}
function openViewer(m){
  const ov=document.createElement('div'); ov.className='overlay'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true');
  const canDelete = !m.static && (m.local || Media.canEdit);
  ov.innerHTML=`<div class="viewer"><div class="viewer-head"><span class="kind ${esc(m.kind)}" style="font:600 10.5px var(--f-mono);text-transform:uppercase;padding:4px 6px;border-radius:4px">${esc(KIND_LABEL[m.kind]||'')}</span><b>${esc(m.title||'Untitled')}</b>${canDelete?'<button class="btn danger" id="vDel" type="button">Delete</button>':''}<button class="btn" id="vClose" type="button">Close</button></div><div class="viewer-body" id="vBody"><span class="notice">Loading…</span></div><div class="viewer-foot" id="vFoot" hidden></div></div>`;
  document.body.appendChild(ov);
  const close=()=>{ ov.remove(); document.removeEventListener('keydown',onKey); };
  const onKey=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',onKey);
  ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  $('#vClose',ov).onclick=close; $('#vClose',ov).focus();
  const del=$('#vDel',ov);
  if(del) del.onclick=async()=>{
    if(del.dataset.confirm!=='1'){ del.dataset.confirm='1'; del.textContent='Delete for everyone?'; return; }
    del.disabled=true; del.textContent='Deleting…';
    try{
      if(m.local){ Media.local=Media.local.filter(x=>x!==m); URL.revokeObjectURL(m.url); Media.emit(); }
      else { await Media.db.doc('media/'+m.id).delete(); if(m.assetId && Media.assets){ try{ await Media.assets.delete(m.assetId); }catch(e){} } }
      close();
    }catch(e){ del.disabled=false; del.textContent='Delete failed. Try again'; }
  };
  const body=$('#vBody',ov), foot=$('#vFoot',ov); const src=mediaSrc(m);
  if(m.kind==='video'){ body.innerHTML=''; const v=document.createElement('video'); v.controls=true; v.src=src; v.playsInline=true; v.onerror=()=>{ body.innerHTML='<span class="notice err">This video could not be loaded here. It may be unavailable to viewers outside the organization.</span>'; }; body.appendChild(v); }
  else if(m.kind==='image'){ body.innerHTML=''; const i=document.createElement('img'); i.alt=m.title||''; i.src=src; body.appendChild(i); }
  else if(m.kind==='link'){ body.innerHTML=`<div class="empty" style="background:var(--surface)"><p>This item opens on another site.</p><a class="btn primary" href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">Open link</a><small class="mono">${esc(m.url)}</small></div>`; }
  else if(m.kind==='slides'){
    (async()=>{
      try{
        const lib=await getPdf();
        let data; if(m.local&&m.file) data=new Uint8Array(await m.file.arrayBuffer()); else { const r=await fetch(src); if(!r.ok) throw new Error('fetch'); data=new Uint8Array(await r.arrayBuffer()); }
        const doc=await lib.getDocument({data}).promise; let page=1;
        body.innerHTML=''; const c=document.createElement('canvas'); body.appendChild(c);
        foot.hidden=false; foot.innerHTML=`<button class="btn" id="pPrev" type="button">Previous</button><span class="mono" id="pNum"></span><button class="btn" id="pNext" type="button">Next</button>`;
        async function render(){ const pg=await doc.getPage(page); const avail=Math.min(body.clientWidth-24, 1400); const vp0=pg.getViewport({scale:1}); const scale=Math.max(0.5,avail/vp0.width); const vp=pg.getViewport({scale:scale*(window.devicePixelRatio||1)});
          c.width=vp.width; c.height=vp.height; c.style.width=(vp.width/(window.devicePixelRatio||1))+'px'; await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; $('#pNum',foot).textContent=`${page} / ${doc.numPages}`; }
        $('#pPrev',foot).onclick=()=>{ if(page>1){page--; render();} }; $('#pNext',foot).onclick=()=>{ if(page<doc.numPages){page++; render();} };
        ov.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') $('#pNext',foot).click(); if(e.key==='ArrowLeft') $('#pPrev',foot).click(); });
        render();
      }catch(e){ body.innerHTML='<span class="notice err">These slides could not be opened. Check that the file is a valid PDF.</span>'; }
    })();
  }
}
function mediaList(root, filter){
  const items=Media.all().filter(filter);
  return items;
}
function bindMediaClicks(root){ root.addEventListener('click',e=>{ const b=e.target.closest('.mcard'); if(!b) return; const m=Media.all().find(x=>String(x.id)===b.dataset.mid); if(m) openViewer(m); }); }

function renderRelated(el, mod, sec){
  const paint=()=>{ const items=Media.all().filter(m=>m.module===mod && m.section===sec);
    el.innerHTML = items.length? `<h3>Slides and videos for this section</h3><div class="media-grid">${items.map(mediaCard).join('')}</div>` : ''; el.hidden=!items.length; };
  paint(); Media.listeners.add(paint); bindMediaClicks(el);
  return ()=>Media.listeners.delete(paint);
}

PAGES.membrane=labPage(SEC('membrane'),
  `<p class="lead">When an excitatory synapse on the apical dendrite opens, positive ions flow into the cell. The extracellular space there loses positive charge and becomes a current sink. The current travels down the dendrite and leaks back out near the soma, which becomes a source. A sink and a source a few hundred microns apart form a dipole.</p>`,
  labMembrane,
  ["Keep <b>Synaptic input</b> selected. Watch the blue sink at the apical tuft and the red source around the soma. The return current outside the cell flows from source to sink.","Switch to <b>Action potential</b>. The spike is brief and its sink sits between two nearby sources, so the field collapses within a short distance.","Choose <b>EPSP that triggers a spike</b>. Drag the electrode next to the axon: the spike dominates. Then compare the distant probe, where only the slow synaptic wave survives."],
  "Postsynaptic currents last tens of milliseconds and separate charge along the whole apical dendrite, so they make a large dipole whose field falls off slowly. Action potentials last about a millisecond and form a tight source-sink-source pattern that cancels at a distance. Pyramidal cells matter because their long apical dendrites, stacked in parallel columns and layers, line these dipoles up across thousands of cells.");

PAGES.synchrony=labPage(SEC('synchrony'),
  `<p class="lead">A single neuron's dipole is far too small to see at the scalp. What reaches the electrode is a sum, and how much survives depends on whether the contributions rise and fall together. Compare two populations on the same vertical scale.</p>`,
  labSynchrony,
  ["Start with the default: 1,000 cells at 0% synchrony against 100 cells at 92%. Read the ratio.","Drag A's synchrony up slowly. Notice how little changes until most phases cluster together.","Set both to 0% synchrony and raise A to 3,000 cells. The sum grows only with the square root of the count."],
  "With random timing, contributions cancel and the sum grows like √N. With aligned timing it grows like N. A smaller synchronous population can therefore outweigh a much larger asynchronous one, which is why EEG amplitude reflects coordination as much as the amount of activity.");

PAGES.fields=labPage(SEC('fields'),
  `<p class="lead">Geometry decides whether currents from many cells reinforce or cancel. In an open field, dipoles share an orientation and the field extends far from the tissue. In a closed field, dipoles point in opposing directions and cancel outside a small region.</p>`,
  labFields,
  ["Compare <b>Parallel pyramidal cells</b> with <b>Stellate cell</b>. Both carry real current, but only one is visible far away.","Read the falloff chart on the right. The pyramidal line drops slowly; the closed-field lines drop several orders of magnitude faster.","Drag the probe close to the stellate cell. Strong local fields exist, which is why intracortical recordings can see activity that scalp EEG misses."],
  "Open fields come from aligned dipoles, such as pyramidal cells in cortical layers. Closed fields come from symmetric arrangements, such as stellate cells with radial dendrites or nuclei with radially arranged cells. Closed-field activity can be intense locally and still contribute almost nothing at the scalp.");

PAGES.folding=labPage(SEC('folding'),
  `<p class="lead">Pyramidal cells stand perpendicular to the cortical surface, so each patch's dipole points along the local surface normal. Because the cortex is folded, the same kind of activity produces very different scalp maps depending on where it happens. This is a coronal slice through a simplified folded cortex.</p>`,
  labFolding,
  ["Start at the <b>Gyral crown</b>. The dipole is radial and produces a single focal peak right above it.","Switch to <b>Sulcal wall</b>. The dipole is tangential: the scalp shows a positive and a negative pole on either side of the source.","Select <b>Fundus</b> and widen the active patch. Once both walls are included, their opposite dipoles cancel and the scalp signal shrinks."],
  "Radial sources at gyral crowns give focal maps centered over the source. Tangential sources in sulcal walls give bipolar maps with the poles displaced from the source. Superficial versus deep synaptic input flips polarity. Opposing walls of a sulcus cancel, so the same total activity can be visible or nearly invisible depending on folding, which varies across people.");

PAGES.scalp=labPage(SEC('scalp'),
  `<p class="lead">Now in three dimensions. Place a dipole inside a spherical head and see the potential it produces at all 21 electrodes of the 10-20 system. Drag the head to rotate it; hover an electrode to read its value. The flat map shows the same field seen from above.</p>`,
  labScalp,
  ["Compare <b>Hand motor cortex, gyral crown</b> with <b>Central sulcus wall</b>. Same location, different orientation. Check which electrode shows the largest response in each case.","Choose <b>Auditory cortex</b>. The source sits in the temporal lobe, yet the strongest deflection appears over central sites, a familiar pattern for auditory responses.","Try the <b>Deep source</b> with fixed colors, then raise the synchronous area. Even 30 cm² at that depth stays weak compared with a superficial source."],
  "Each electrode records a weighted blend of sources across the head, and the electrode nearest the source is often not the one with the biggest signal. Depth weakens a source quickly; orientation decides where its poles land. Commonly cited estimates put a clearly visible scalp signal at several square centimeters of coherently active cortex, which you should treat as an approximation.");

    <header class="head"><span class="eyebrow">Module 1 · Synthesis</span><h1>What EEG misses</h1>
      <div class="prose"><p class="lead">Put the labs together and a clear bias emerges. Scalp EEG favors superficial, synchronous, favorably oriented, open-field generators. Everything else is attenuated, cancelled, or lost.</p></div></header>
    <div class="grid2">
      <div class="panel"><h3>Visible at the scalp</h3><ul class="list">
        <li>Synchronous postsynaptic activity in aligned pyramidal cells</li>
        <li>Patches of several square centimeters of coherently active cortex (an approximation)</li>
        <li>Superficial sources, especially radial ones at gyral crowns</li>
        <li>Tangential sulcal sources, with displaced bipolar maps</li></ul></div>
      <div class="panel"><h3>Largely invisible</h3><ul class="list">
        <li>Deep structures, whose fields fade with distance <a href="#scalp" data-go="scalp">(Lab 5, deep source)</a></li>

        <li>Asynchronous activity, which cancels <a href="#synchrony" data-go="synchrony">(Lab 2)</a></li>
        <li>Closed-field arrangements <a href="#fields" data-go="fields">(Lab 3)</a></li>
        <li>Activity on opposing sulcal walls that cancels <a href="#folding" data-go="folding">(Lab 4)</a></li>

    </div>

function quizPage(mod, QZ, lead){
  return (page)=>{
  const ans=quizStore(mod); const M=modOf(mod);
  page.innerHTML=`
    <header class="head"><span class="eyebrow">Module ${M.n} · Quiz</span><h1>Misconceptions check</h1>
      <div class="prose"><p class="lead">${lead}</p></div>
      <div style="display:flex;gap:16px;align-items:center"><span class="score" id="qScore"></span><button class="btn" id="qReset" type="button">Start over</button></div></header>
    <section class="panel" id="qList">${QZ.map((q,i)=>`
      <div class="q" data-i="${i}"><b>${i+1}. ${esc(q.q)}</b>
        <div class="opts">${q.o.map((o,j)=>`<button class="opt" type="button" data-j="${j}">${esc(o)}</button>`).join('')}</div>
        <div class="why" hidden></div></div>`).join('')}</section>`;
  function paint(){
    let right=0, done=0;
    $$('.q',page).forEach(el=>{ const i=+el.dataset.i, q=QZ[i], a=ans[i];
      $$('.opt',el).forEach(b=>{ const j=+b.dataset.j; b.classList.toggle('right', a!=null && j===q.a); b.classList.toggle('wrong', a!=null && j===a && a!==q.a); b.disabled=a!=null; });
      const why=$('.why',el); if(a!=null){ done++; if(a===q.a) right++; why.hidden=false; why.innerHTML=`<b style="color:var(--ink)">${a===q.a?'Correct.':'Not quite.'}</b> ${esc(q.why)} <a href="#${q.link}" data-go="${q.link}">Open the lab</a>`; } else why.hidden=true; });
    $('#qScore',page).textContent=`${right} / ${QZ.length} correct${done<QZ.length?` · ${QZ.length-done} left`:''}`;
  }
  $('#qList',page).addEventListener('click',e=>{ const b=e.target.closest('.opt'); if(!b) return; const i=+b.closest('.q').dataset.i; ans[i]=+b.dataset.j; store.save(); paint(); updateProgress(); });
  $('#qReset',page).onclick=()=>{ Object.keys(ans).forEach(k=>delete ans[k]); store.save(); paint(); updateProgress(); };
  paint();
  };
}

class Grid{

/* spherical splines (Perrin et al. 1989), m = 4 */
function legTable(coef,N){ const S=2001, T=new Float64Array(S); for(let k=0;k<S;k++){ const x=-1+2*k/(S-1); let pm=1,p=x,s=coef(1)*x; for(let n=2;n<=N;n++){ const pn=((2*n-1)*x*p-(n-1)*pm)/n; pm=p; p=pn; s+=coef(n)*p; } T[k]=s; }

function labConduction(root){

      const corr=(G)=>{ const w=ths.map(t=>G.map(g=>g.sample(t/100,0))); const [a1,b1]=w[0], [a2,b2]=w[1]; return (a1*a2+b1*b2)/Math.sqrt((a1*a1+b1*b1)*(a2*a2+b2*b2)); };
      $('#v1corl',root).textContent='Correlation, electrodes over A and B';
      $('#v1cor',root).textContent=`cortex ${corr(cxA).toFixed(2)} · scalp ${corr(scA).toFixed(2)}`;
    } else {
      const area=(G,mx,r)=>{ let n=0; const cell=(2*E/N*100)*D2R*R_CM*r; for(let j=0;j<N;j++) for(let i=0;i<N;i++){ const dx=G.xy(i), dy=G.xy(j); if(dx*dx+dy*dy<=1 && Math.abs(G.d[j*N+i])>=0.5*mx) n++; } return n*cell*cell; };
      $('#v1resl',root).textContent='Area above half maximum'; $('#v1res',root).textContent=`cortex ≈${area(gCx,mCx,RC).toFixed(0)} cm² · scalp ≈${area(gSc,mSc,1).toFixed(0)} cm²`;
      $('#v1corl',root).textContent='Electrodes picking up half the peak';
      let n=0; E1010.forEach(e=>{ const [dx,dy]=sphToFlat(e.p); if(Math.abs(gSc.sample(dx,dy))>=0.5*mSc) n++; });
      $('#v1cor',root).textContent=`${n} of 61 (10-10 layout)`;
    }
    $('#v1trw',root).hidden=S.mode!=='two';
    drawMaps(); drawProfile();
  }
  function drawMap(st,heat,G,vmax,title,isScalp){
    const geo=topoGeo(st);
    paintTopo(st,heat,geo,(dx,dy)=>G.sample(dx,dy)/vmax);
    cTitle(st.ctx,title,12,18);
    D.srcs.forEach((s,i)=>{ const [x,y]=flatPx(geo,s.u); xMark(st.ctx,x,y,5,C.ink); cText(st.ctx,S.mode==='two'?'AB'[i]:'',x+7,y-7,C.ink,'left',11); });
    if(isScalp) E1010.forEach(e=>{ const [x,y]=flatPx(geo,e.p); st.ctx.fillStyle=rgb(C.inkRGB,0.55); st.ctx.beginPath(); st.ctx.arc(x,y,1.6,0,7); st.ctx.fill(); });
  }
  function drawMaps(){ drawMap(cx,hA,D.gCx,D.mCx,'On the cortex (what a grid on the brain would see)',false); drawMap(sc,hB,D.gSc,S.shared?D.mCx:D.mSc,'At the scalp, through skull and skin',true); }
  function drawProfile(){
    const ctx=pr.ctx,{w,h}=pr; ctx.fillStyle=C.surface; ctx.fillRect(0,0,w,h);
    const L=46,R=w-14,T=34,B=h-34; const xs=th=>L+(th+90)/180*(R-L);
    cTitle(ctx,'Potential along a left-to-right line through the sources',L-34,18);
    const vC=D.mCx, vS=S.shared?D.mCx:D.mSc; const ys=v=>T+(1-v)/2*(B-T);
    ctx.strokeStyle=C.line; ctx.lineWidth=1; [1,0,-1].forEach(v=>{ ctx.beginPath(); ctx.moveTo(L,ys(v)); ctx.lineTo(R,ys(v)); ctx.stroke(); });
    cText(ctx,'max',L-6,ys(1)+4,C.muted,'right'); cText(ctx,'0',L-6,ys(0)+4,C.muted,'right');
    const line=(fn,color,width,dash)=>{ ctx.strokeStyle=color; ctx.lineWidth=width; ctx.setLineDash(dash||[]); ctx.beginPath(); for(let k=0;k<=180;k++){ const th=-90+k; const y=ys(clamp(fn(th),-1.05,1.05)); k?ctx.lineTo(xs(th),y):ctx.moveTo(xs(th),y); } ctx.stroke(); ctx.setLineDash([]); };
    line(th=>D.gCx.sample(th/100,0)/vC, C.muted, 1.6, [5,4]);
    line(th=>D.gSc.sample(th/100,0)/vS, C.accent, 2.4);
    D.ths.forEach((t,i)=>{ ctx.strokeStyle=rgb(C.inkRGB,0.35); ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(xs(t),T); ctx.lineTo(xs(t),B); ctx.stroke(); ctx.setLineDash([]); cText(ctx,S.mode==='two'?'AB'[i]:'source',xs(t),B+13,C.ink,'center',11); });
    [-12,-8,-4,0,4,8].forEach(cm=>{ const th=cm/R_CM/D2R; cText(ctx,cm+'',xs(th),h-6,C.muted,'center'); });
    cText(ctx,'cm from vertex →',R,h-6,C.muted,'right');
    cText(ctx,'left ear',L,B+13,C.muted,'left'); cText(ctx,'right ear',R,B+13,C.muted,'right');
    ctx.textAlign='right'; cText(ctx,'— scalp',R,T-8,C.accent,'right',11); cText(ctx,'- - cortex',R-70,T-8,C.muted,'right',11);
  }
  let time=0;
  const sA=t=>Math.sin(2*Math.PI*10*t)*(0.65+0.35*Math.sin(2*Math.PI*0.7*t)), sB=t=>Math.sin(2*Math.PI*6.3*t+1)*(0.65+0.35*Math.sin(2*Math.PI*0.45*t+2));
  function drawTraces(){
    if(S.mode!=='two') return; const ctx=tr.ctx,{w,h}=tr; ctx.fillStyle=C.surface; ctx.fillRect(0,0,w,h);
    const L=150,R=w-12, rows=[['cortex over A',D.cxA,0],['cortex over B',D.cxA,1],['scalp over A',D.scA,0],['scalp over B',D.scA,1]];
    const rh=(h-24)/4;
    cText(ctx,'A carries a 10 Hz rhythm, B a 6 Hz rhythm',L,14,C.muted);
    rows.forEach(([lab,G,k],r)=>{ const y0=24+rh*(r+.5); const wA=G[0].sample(D.ths[k]/100,0), wB=G[1].sample(D.ths[k]/100,0); const mx=Math.abs(wA)+Math.abs(wB)||1;
      cText(ctx,lab,12,y0+4,r<2?C.muted:C.accent,'left',11);
      ctx.strokeStyle=r<2?C.muted:C.accent; ctx.lineWidth=1.5; ctx.beginPath();
      for(let x=L;x<=R;x+=2){ const t=time+(x-L)/(R-L)*1.0; const v=(wA*sA(t)+wB*sB(t))/mx; const y=y0-v*rh*0.42; x===L?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); });
  }
  bindSeg(root,'v1mode',v=>{ S.mode=v; compute(); });
  $('#v1shared',root).onchange=e=>{ S.shared=e.target.checked; drawMaps(); drawProfile(); };
  let pend=0; const later=()=>{ cancelAnimationFrame(pend); pend=requestAnimationFrame(compute); };
  $('#v1ratio',root).oninput=e=>{ S.ratio=+e.target.value; later(); };
  $('#v1sep',root).oninput=e=>{ S.sep=+e.target.value; later(); };
  $('#v1dep',root).oninput=e=>{ S.depth=+e.target.value; later(); };
  cx.onresize=()=>D.gCx&&drawMaps(); sc.onresize=()=>D.gCx&&drawMaps(); pr.onresize=()=>D.gCx&&drawProfile();
  compute();
  const redraw=()=>{ drawMaps(); drawProfile(); }; themeListeners.add(redraw);
  const stop=rafLoop(dt=>{ if(!reduceMotion) time+=dt/1000*0.35; drawTraces(); });
  return ()=>{ stop(); [cx,sc,pr,tr].forEach(x=>x.destroy()); themeListeners.delete(redraw); };
}

/* =========================================================================

function patchSources(colat,az,radiusCm,depth){ const u=sph(colat,az), [eth,eph]=tangBasis(colat,az), out=[];
  const st=radiusCm/Math.ceil(radiusCm/0.75);
  for(let i=-radiusCm;i<=radiusCm+1e-9;i+=st) for(let j=-radiusCm;j<=radiusCm+1e-9;j+=st){ if(Math.hypot(i,j)>radiusCm) continue; const d=norm3([0,1,2].map(k=>u[k]+(i*eth[k]+j*eph[k])/R_CM)); const a=angles(d); out.push(mkDip(a.colat,a.az,depth,'radial',0,1)); }
  out.forEach(s=>s.m=s.m.map(x=>x/out.length*6)); return out; }
const FIT_TARGETS={
  focal:{label:'Map 1', srcs:()=>[mkDip(40,60,2.0,'radial',0,1)], note:'One focal source on a gyral crown. A single dipole explains this map almost completely and lands where the activity is.'},
  auditory:{label:'Map 2', srcs:()=>[mkDip(72,-88,4.5,'tangential',0,1), mkDip(72,88,4.5,'tangential',0,1)], note:'Two sources, one in each auditory cortex, both pointing up and down along the temporal plane. Together they make one broad central negativity. The best single dipole sits deep in the midline, where nothing is active, and still explains about 85% of the map. A central maximum does not mean a central generator.'},
  patch:{label:'Map 3', srcs:()=>patchSources(34,-50,3,1.6), note:'A patch of superficial cortex about 6 cm across, all active together. A single dipole fits it well but sits deeper than any of the real activity, because a broad map looks like a deep source.'},
  distant:{label:'Map 4', srcs:()=>[mkDip(42,-25,2,'radial',0,1), mkDip(58,165,2,'radial',0,0.9)], note:'Two separate sources, frontal and parietal, active at the same time. No single dipole explains this map well. A low fit is a sign that the one-dipole assumption is wrong, so the model has to change.'}
};
function labInverse(root){
  root.innerHTML=`
  <div class="lab">
    <div class="lab-bar"><span class="eyebrow">Recorded map</span><div class="chips" id="f2t">${Object.entries(FIT_TARGETS).map(([k,t],i)=>`<button class="chip" data-t="${k}" aria-pressed="${i===1}" type="button">${t.label}</button>`).join('')}</div><span class="grow"></span>
      <button class="btn" id="f2auto" type="button">Find the best single dipole</button><button class="btn primary" id="f2rev" type="button">Reveal the true sources</button></div>
    <div class="split even">
      <div class="stage"><canvas id="f2tg" aria-label="Recorded scalp map"></canvas></div>
      <div class="stage"><canvas id="f2md" aria-label="Your model map. Click or drag to move the dipole"></canvas></div>
    </div>
    <div class="stage scroll"><canvas id="f2vw" aria-label="Front and top views of the head with sources"></canvas></div>
    <div class="note-box" id="f2note" hidden></div>

      <div class="ctl"><span class="lbl">How to use</span><span style="font-size:13px;color:var(--muted)">Click or drag on the right map to move your dipole. Its orientation and strength are fitted for you at each position.</span></div>
    </div>
    <div class="lab-foot">
      <div class="readout"><span class="eyebrow">Variance explained</span><span class="v fit" id="f2gof">0%</span></div>

      <div class="readout"><span class="eyebrow">Model orientation</span><span class="v" id="f2o">0</span></div>
      <div class="readout"><span class="eyebrow">Sources that made the map</span><span class="v" id="f2n">hidden</span></div>
    </div>
  </div>`;
  const tg=setupCanvas($('#f2tg',root),w=>Math.max(260,Math.min(400,w*0.95)));
  const md=setupCanvas($('#f2md',root),w=>Math.max(260,Math.min(400,w*0.95)));
  const vw=setupCanvas($('#f2vw',root),w=>w<560?Math.round(w*1.0):230);
  const hT=makeHeat(), hM=makeHeat();
  const EL=E1010.map(e=>e.p), NE=EL.length;
  const S={target:'auditory', u:sph(30,-20), depth:2, reveal:false};
  const FSP=makeSpline(EL,1e-7), FOP=mapOperator(FSP,56,'g');
  let target, v, vnorm, model;
  const avgRef=a=>{ let m=0; for(const x of a) m+=x; m/=a.length; return a.map(x=>x-m); };
  const UNIT=[[1,0,0],[0,1,0],[0,0,1]];
  function fitAt(p){
    const G=UNIT.map(m=>avgRef(EL.map(e=>dipV(e,{r0:p,m}))));
    const M=new Float64Array(9), y=new Float64Array(3);
    for(let a=0;a<3;a++){ for(let b=0;b<3;b++){ let s=0; for(let k=0;k<NE;k++) s+=G[a][k]*G[b][k]; M[a*3+b]=s+(a===b?1e-9:0); } let s=0; for(let k=0;k<NE;k++) s+=G[a][k]*v[k]; y[a]=s; }
    const m=luSolve(luFactor(M,3),y); let res=0; for(let k=0;k<NE;k++){ const f=m[0]*G[0][k]+m[1]*G[1][k]+m[2]*G[2][k]; res+=(v[k]-f)**2; }
    return {m:[m[0],m[1],m[2]], gof:1-res/vnorm, p}; }
  function setTarget(k){ S.target=k; target=FIT_TARGETS[k].srcs(); v=avgRef(EL.map(e=>sumV(e,target))); vnorm=v.reduce((a,x)=>a+x*x,0); S.reveal=false; $('#f2rev',root).textContent='Reveal the true sources'; update(); }
  function modelPos(){ const r=1-S.depth/R_CM; return S.u.map(x=>x*r); }
  function update(){
    model=fitAt(modelPos());
    $('#f2gof',root).textContent=Math.max(0,model.gof*100).toFixed(1)+'%';
    $('#f2gof',root).style.color=model.gof>0.95?'var(--ok)':model.gof>0.8?'var(--warn)':'var(--pos)';
    $('#f2depo',root).textContent=S.depth.toFixed(1)+' cm'; $('#f2d',root).textContent=angles(S.u).colat>99?`${((1-S.depth/R_CM)*R_CM).toFixed(1)} cm below head center`:S.depth.toFixed(1)+' cm below scalp';
    const un=norm3(S.u), mn=norm3(model.m); const ang=Math.acos(Math.abs(clamp(dot3(un,mn),-1,1)))/D2R;
    if(angles(S.u).colat>99){ const v=Math.acos(Math.abs(clamp(mn[2],-1,1)))/D2R; $('#f2o',root).textContent=`${Math.round(v)}° from vertical`; }
    else $('#f2o',root).textContent=`${Math.round(ang)}° from radial (${ang<25?'radial':ang>65?'tangential':'oblique'})`;
    $('#f2n',root).textContent=S.reveal?`${target.length>2?target.length+' dipoles (one patch)':target.length===1?'1 dipole':target.length+' dipoles'}`:'hidden';
    $('#f2note',root).hidden=!S.reveal; $('#f2note',root).textContent=FIT_TARGETS[S.target].note;
    draw();
  }
  function mapAt(fn,st,heat,title){ const geo=topoGeo(st);
    let vmax=0; const vals=EL.map(fn); const mean=vals.reduce((a,x)=>a+x,0)/NE; const ref=vals.map(x=>x-mean); ref.forEach(x=>vmax=Math.max(vmax,Math.abs(x)));
    const G=applyMap(FOP,FSP.coef(ref),0);
    paintTopo(st,heat,geo,(dx,dy)=>dx*dx+dy*dy>0.6084?null:G.sample(dx,dy)/(vmax||1)); cTitle(st.ctx,title,12,18);
    st.ctx.strokeStyle=rgb(C.inkRGB,0.3); st.ctx.setLineDash([3,4]); st.ctx.beginPath(); st.ctx.arc(geo.cx,geo.cy,geo.Rt*0.78,0,7); st.ctx.stroke(); st.ctx.setLineDash([]);
    EL.forEach(e=>{ const [x,y]=flatPx(geo,e); st.ctx.fillStyle=rgb(C.inkRGB,0.6); st.ctx.beginPath(); st.ctx.arc(x,y,1.7,0,7); st.ctx.fill(); });
    return geo; }
  function draw(){
    const g1=mapAt(e=>sumV(e,target),tg,hT,'Recorded map (average reference)');
    if(S.reveal) target.forEach((s,i)=>{ if(target.length>3 && i%3) return; const [x,y]=flatPx(g1,s.u); xMark(tg.ctx,x,y,4,C.ink); });
    const mdip={r0:model.p, m:model.m};
    const g2=mapAt(e=>dipV(e,mdip),md,hM,'Your single-dipole model');
    if(angles(S.u).colat<=99){ const [x,y]=flatPx(g2,S.u); md.ctx.fillStyle=C.accent; md.ctx.strokeStyle=C.surface; md.ctx.lineWidth=2; md.ctx.beginPath(); md.ctx.arc(x,y,6,0,7); md.ctx.fill(); md.ctx.stroke(); }
    else cText(md.ctx,'your dipole sits below the center of the head',12,md.h-8,C.accent,'left',11);
    if(angles(S.u).colat<=99) cText(md.ctx,'click or drag to move',md.w-10,md.h-8,C.muted,'right');
    cText(tg.ctx,'map drawn where electrodes are',tg.w-10,tg.h-8,C.muted,'right');
    drawViews();
  }
  function drawViews(){
    const ctx=vw.ctx,{w,h}=vw; ctx.fillStyle=C.surface; ctx.fillRect(0,0,w,h);
    const stack=w<560; const Rv=stack?Math.min(w*0.42,h*0.21):Math.min(h*0.38,w*0.2);
    const centers=stack?[[w/2,h*0.27],[w/2,h*0.76]]:[[w*0.3,h*0.55],[w*0.7,h*0.55]];

    views.forEach(([title,proj],k)=>{ const [cx,cy]=centers[k];
      ctx.strokeStyle=C.ink; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(cx,cy,Rv,0,7); ctx.stroke();

      cTitle(ctx,title,cx-Rv,cy-Rv-10);
      cText(ctx,'L',cx-Rv-12,cy+4,C.muted,'center'); cText(ctx,'R',cx+Rv+12,cy+4,C.muted,'center');
      const P=p=>{ const q=proj(p); return [cx+q[0]*Rv, cy+q[1]*Rv]; };
      const dipArrow=(r0,m,color,len)=>{ const a=P(r0); const mm=norm3(m); const b=P([r0[0]+mm[0]*len,r0[1]+mm[1]*len,r0[2]+mm[2]*len]); ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=2; if(Math.hypot(b[0]-a[0],b[1]-a[1])>3) arrow(ctx,a[0],a[1],b[0],b[1],6); ctx.beginPath(); ctx.arc(a[0],a[1],4,0,7); ctx.fill(); };

      dipArrow(model.p,model.m,C.accent,0.2);
    });

  }
  function autoFit(){
    let best={gof:-1e9};

  $('#f2t',root).addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; $$('#f2t .chip',root).forEach(c=>c.setAttribute('aria-pressed',c===b)); setTarget(b.dataset.t); });
  $('#f2rev',root).onclick=()=>{ S.reveal=!S.reveal; $('#f2rev',root).textContent=S.reveal?'Hide the true sources':'Reveal the true sources'; update(); };
  $('#f2auto',root).onclick=()=>{ const b=$('#f2auto',root); b.disabled=true; b.textContent='Searching…'; setTimeout(()=>{ autoFit(); b.disabled=false; b.textContent='Find the best single dipole'; },30); };

  cv.addEventListener('pointerdown',e=>{ drag=true; cv.setPointerCapture(e.pointerId); place(e); });
  cv.addEventListener('pointermove',e=>{ if(drag) place(e); });
  cv.addEventListener('pointerup',()=>drag=false);
  tg.onresize=md.onresize=vw.onresize=()=>{ if(model) draw(); };
  themeListeners.add(draw);
  setTarget('auditory');
  return ()=>{ [tg,md,vw].forEach(x=>x.destroy()); themeListeners.delete(draw); };
}

  const cvs=['d3t','d3r','d3e'].map(id=>setupCanvas($('#'+id,root),w=>Math.max(220,Math.min(330,w*0.98))));
  const heats=cvs.map(()=>makeHeat());
  const ch=setupCanvas($('#d3c',root),()=>210);
  const CFG={ three:()=>[mkDip(40,-60,1.8,'radial',0,1), mkDip(50,45,2.2,'tangential',90,0.8), mkDip(62,170,1.8,'radial',0,-0.75)],
              close:()=>{ const d=2.5/R_CM/D2R; return [mkDip(32-d/2,-65,1.7,'radial',0,1), mkDip(32+d/2,-65,1.7,'radial',0,1)]; } };
  const sets={}; function elecs(n){ if(!sets[n]){ const pts=n===21?E1020_SET.map(e=>e.p):fibCap(n,105); const sp=makeSpline(pts,1e-7); sets[n]={pts,sp,op:mapOperator(sp,56,'g'),spacing:nnMedianCm(pts)}; } return sets[n]; }
  const truths={};
  function truth(cfg,skull){ const k=cfg+skull; if(truths[k]) return truths[k]; const srcs=CFG[cfg]();
    let G=new Grid(80,1.15).fill((dx,dy)=>sumV(flatToSph(dx,dy),srcs)); if(skull==='skull') G=G.blurred(2.6*Math.sqrt(24)/(2.3/80*100));
    const fn=p=>{ const [dx,dy]=sphToFlat(p); return G.sample(dx,dy); };

  const errs={};

    let num=0,den=0; const g=R; for(let j=0;j<g.N;j++) for(let i=0;i<g.N;i++){ const dx=g.xy(i),dy=g.xy(j); if(dx*dx+dy*dy>0.7225) continue; const t=T.disk.d[j*g.N+i], r=R.d[j*g.N+i]; num+=(r-t)**2; den+=t*t; }
    return {R,err:Math.sqrt(num/den)}; }
  function err(cfg,skull,n){ const k=cfg+skull+n; if(errs[k]==null) errs[k]=recon(cfg,skull,n).err; return errs[k]; }
  let cur;
