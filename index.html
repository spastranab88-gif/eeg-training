    if(!items.length){ grid.innerHTML=`<div class="empty"><b style="color:var(--ink)">Nothing here yet</b><span>${Media.canEdit||Media.mode!=='shared'?'Add the first slides or video above.':'Slides and videos appear here once a trainer adds them.'}</span></div>`; return; }
    const groups={slides:'Slides',video:'Videos',image:'Images',link:'Links'};
    grid.innerHTML=Object.entries(groups).map(([k,t])=>{ const g=items.filter(m=>m.kind===k); return g.length?`<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:22px"><h3>${t} <span class="tag">${g.length}</span></h3><div class="media-grid">${g.map(mediaCard).join('')}</div></div>`:''; }).join('');
  }
  $('#mFilter',page).addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; filter=b.dataset.f; $$('#mFilter .chip',page).forEach(c=>c.setAttribute('aria-pressed',c===b)); paint(); });
  async function handle(file){
    if(!file) return; const [kind,type]=kindOf(file);
    if(kind==='convert') return status('Export the deck as PDF first (File, then Export or Save as PDF), then upload the PDF.',true);
    if(!kind) return status('This file type is not supported. Use PDF, PNG, JPG, GIF, WebP, MP4 or WebM.',true);
    const title=$('#mTitle',page).value.trim()||file.name.replace(/\.[^.]+$/,'');
    const meta={module:modSel.value, section:secSel.value, kind, title, contentType:type, sizeBytes:file.size, addedAt:Date.now()};
    if(Media.mode!=='shared'){ Media.local.unshift({...meta,id:'local'+Date.now(),local:true,url:URL.createObjectURL(file),file}); Media.emit(); status('Added for this session.'); return; }
    if(file.size>20*1024*1024) return status('This file is over 20 MB. Compress the video, split the deck, or upload it elsewhere and add it as a link.',true);
    status('Uploading '+file.name+'…');
    try{
      const r=await Media.assets.upload(file,{type});
      await Media.db.collection('media').add({...meta, assetId:r.id, sizeBytes:r.sizeBytes, contentType:r.contentType});
      $('#mTitle',page).value=''; status('Added "'+title+'".');
    }catch(e){
      const c=e&&e.code; const msg={too_large:'This file is over the size limit. Compress it or add it as a link.',unsupported_type:'This file type is not accepted. Use PDF, PNG, JPG, MP4 or WebM.',quota_or_state:'Library storage is full. Delete unused items, then try again.',rate_limited:'Too many uploads at once. Wait a moment and try again.',not_granted:'Only editors of this page can upload.'}[c]||'The upload did not finish. Try again in a moment.';
      status(msg,true);
    }
  }
  $('#mFile',page).onchange=e=>{ handle(e.target.files[0]); e.target.value=''; };
  const drop=$('#mDrop',page);
  drop.addEventListener('dragover',e=>{ e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('over'); handle(e.dataTransfer.files[0]); });
  $('#mAddLink',page).onclick=async()=>{
    const url=$('#mUrl',page).value.trim(); let ok=false; try{ ok=['https:','http:'].includes(new URL(url).protocol); }catch(e){}
    if(!ok) return status('Enter a full web address starting with https://',true);
    const title=$('#mTitle',page).value.trim()||new URL(url).hostname;
    try{ await Media.db.collection('media').add({module:modSel.value, section:secSel.value, kind:'link', title, url, addedAt:Date.now()}); $('#mUrl',page).value=''; $('#mTitle',page).value=''; status('Added link "'+title+'".'); }
    catch(e){ status('The link could not be saved. Only editors of this page can add items.',true); }
  };
  bindMediaClicks($('#mGrid',page));
  paint(); Media.listeners.add(paint);
  return ()=>Media.listeners.delete(paint);
};

function plannedPage(mod){
  return (page)=>{
    page.innerHTML=`
      <header class="head"><span class="eyebrow">${typeof mod.n==='number'?'Theory Track · Module '+mod.n:'Practical Track'} · In development</span><h1>${esc(mod.title)}</h1>
        <div class="prose"><p class="lead">${esc(mod.summary)}</p></div></header>
      <section class="panel"><h3>Planned topics</h3><ul class="list">${mod.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></section>
      <section class="callout"><b>Building this module</b><span style="color:var(--muted)">Interactive labs for this module will follow the Module 1 pattern. Trainers can already add slides and videos for it in the <a href="#media" data-go="media">library</a>.</span></section>
      <section class="related" id="related" hidden></section>`;
    return renderRelated($('#related',page),mod.id,'general');
  };
}
COURSE.modules.slice(1).forEach(m=>PAGES[m.id]=plannedPage(m));

/* =========================================================================
   NAVIGATION
   ========================================================================= */
const ORDER=[...M1.sections.map(s=>s.id),'media'];
function titleOf(id){ const s=SEC(id); if(s) return s.title; if(id==='media') return 'Slides and videos'; const m=COURSE.modules.find(x=>x.id===id); return m?m.title:''; }
function renderNav(cur){
  const v=store.data.visited;
  $('#nav').innerHTML=`
    <span class="eyebrow">Theory Track</span>
    <a class="mod" href="#overview" data-go="overview"><span class="tick ${v.overview?'done':''}"></span>Module 1 · Origin of the EEG signal</a>
    ${M1.sections.slice(1).map(s=>`<a class="sub" href="#${s.id}" data-go="${s.id}" ${cur===s.id?'aria-current="page"':''}><span class="tick ${v[s.id]?'done':''}"></span>${esc(s.title)}</a>`).join('')}
    ${COURSE.modules.slice(1).filter(m=>typeof m.n==='number').map(m=>`<a class="mod" href="#${m.id}" data-go="${m.id}" ${cur===m.id?'aria-current="page"':''}><span class="tick"></span><span>Module ${m.n} · ${esc(m.title)}</span><span class="lock">soon</span></a>`).join('')}
    <span class="eyebrow" style="margin-top:14px">Practical Track</span>
    ${COURSE.modules.filter(m=>typeof m.n!=='number').map(m=>`<a class="mod" href="#${m.id}" data-go="${m.id}" ${cur===m.id?'aria-current="page"':''}><span class="tick"></span><span>${esc(m.title.replace('Practical: ',''))}</span><span class="lock">soon</span></a>`).join('')}
    <span class="eyebrow" style="margin-top:14px">Library</span>
    <a class="mod" href="#media" data-go="media" ${cur==='media'?'aria-current="page"':''}><span class="tick"></span>Slides and videos</a>`;
  if(cur==='overview') $('#nav a[data-go="overview"]').setAttribute('aria-current','page');
}
function updateProgress(){
  const v=store.data.visited; const secs=M1.sections.map(s=>s.id);
  const visited=secs.filter(s=>v[s]).length; const objs=Object.values(store.data.obj).filter(Boolean).length; const q=Object.keys(store.data.quiz).length;
  const pct=Math.round(((visited/secs.length)*0.5 + (objs/5)*0.3 + (q/QUIZ.length)*0.2)*100);
  $('#progBar').style.width=pct+'%'; $('#progTxt').textContent=pct+'%';
}
let unmount=null, current=null;
function go(id, push){
  if(!PAGES[id]) id='overview';
  if(unmount){ try{unmount();}catch(e){} unmount=null; }
  current=id; const page=$('#page'); page.innerHTML='';
  unmount=PAGES[id](page)||null;
  const i=ORDER.indexOf(id);
  if(i>=0){ const prev=ORDER[i-1], next=ORDER[i+1]; const pg=document.createElement('nav'); pg.className='pager'; pg.setAttribute('aria-label','Section navigation');
    pg.innerHTML=(prev?`<a href="#${prev}" data-go="${prev}"><span class="eyebrow">Previous</span><b>${esc(titleOf(prev))}</b></a>`:'')+(next?`<a class="next" href="#${next}" data-go="${next}"><span class="eyebrow">Next</span><b>${esc(titleOf(next))}</b></a>`:'');
    page.appendChild(pg); }
  if(SEC(id)){ store.data.visited[id]=true; store.save(); }
  renderNav(id); updateProgress();
  $('#topTitle').textContent=titleOf(id);
  $('#side').classList.remove('open');
  if(push){ try{ history.replaceState(null,'','#'+id); }catch(e){} window.scrollTo(0,0); }
}
document.addEventListener('click',e=>{ const a=e.target.closest('[data-go]'); if(!a) return; e.preventDefault(); go(a.dataset.go,true); });
window.addEventListener('hashchange',()=>{ const id=location.hash.slice(1); if(id&&id!==current) go(id,false); });
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#side').classList.remove('open'); });
go((location.hash||'#overview').slice(1), false);
</script>
